<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Account - JR-UD-HUB</title><link rel="stylesheet" href="public.css"><link rel="stylesheet" href="account.css"></head>
<body><header class="main-header" id="main-header"></header><nav class="side-nav" id="side-nav"></nav><div class="nav-overlay" id="nav-overlay"></div>
<main class="container account-page">
  <section id="auth-view" class="account-card auth-card"><h1>Welcome</h1><p>Sign in to manage your profile, addresses and orders.</p>
    <button id="google-login" class="account-button google">Continue with Google</button><div class="or">OR</div>
    <form id="email-form"><input id="auth-name" placeholder="Full name (for new account)"><input id="auth-email" type="email" placeholder="Email address" required><input id="auth-password" type="password" minlength="6" placeholder="Password (minimum 6 characters)" required><button class="account-button" type="submit">Sign in / Create account</button></form>
    <button id="forgot-password" class="text-button">Forgot password?</button>
    <div class="or">OR</div><p>Sign in with mobile OTP</p><div id="recaptcha-container"></div><form id="phone-form"><input id="phone-number" type="tel" placeholder="+91XXXXXXXXXX"><button class="account-button" type="submit">Send OTP</button></form><form id="otp-form" hidden><input id="otp-code" inputmode="numeric" maxlength="6" placeholder="Enter 6 digit OTP"><button class="account-button" type="submit">Verify & Sign in</button></form><p id="auth-message" class="message" aria-live="polite"></p>
  </section>
  <section id="account-view" hidden><div class="account-heading"><div><h1>My Account</h1><p id="account-email"></p></div><button id="logout" class="text-button">Logout</button></div>
    <div class="account-grid"><section class="account-card"><h2>Profile</h2><form id="profile-form"><label>Name<input id="profile-name" required></label><label>Phone number<input id="profile-phone" readonly></label><label>Email<input id="profile-email" readonly></label><button class="account-button">Save profile</button></form></section>
    <section class="account-card"><div class="section-row"><h2>My Addresses</h2><button id="new-address" class="text-button">+ Add address</button></div><div id="address-form-wrap" hidden><form id="address-form"><input id="address-id" type="hidden"><label>Label<input id="address-label" placeholder="Home / Office" required></label><label>Recipient name<input id="address-name" required></label><label>Phone<input id="address-phone" type="tel" required></label><label>House / Street<textarea id="address-line" required></textarea></label><label>City<input id="address-city" required></label><label>State<input id="address-state" required></label><label>Pincode<input id="address-pincode" required></label><label class="checkbox"><input id="address-default" type="checkbox"> Set as default address</label><button class="account-button">Save address</button></form></div><div id="addresses-list"></div></section></div>
    <section class="account-card orders"><h2>My Orders</h2><div id="orders-list"><p>No orders yet.</p></div></section><p id="account-message" class="message" aria-live="polite"></p>
  </section>
</main><footer class="main-footer-new" id="main-footer"></footer><script src="public-router.js"></script><script type="module" src="common.js"></script><script type="module" src="account.js"></script></body></html>
