<!-- 
  ഇതാണ് കാറ്റഗറി പേജ്. 
  'index.html' പോലെ, ഇതും 'public.css'-ഉം 'common.js'-ഉം ഉപയോഗിക്കുന്നു.
  ഈ പേജിന് മാത്രമായി 'categories.js' എന്ന ഫയലുമുണ്ട്.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- *** മൊബൈൽ റെസ്പോൺസീവ് ഡിസൈനിനായി ഈ വരി തിരികെ ചേർത്തു *** -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Al Ambar Perfumes</title>
    <!-- പൊതുവായ ഡിസൈൻ ഫയൽ -->
    <link rel="stylesheet" href="public.css">
</head>
<body>

    <!-- 1. പുതിയ ഹെഡർ (common.js വഴി ലോഡ് ആവും) -->
    <header class="main-header" id="main-header"></header>
    
    <!-- 2. വശത്തുള്ള മെനു (common.js വഴി ലോഡ് ആവും) -->
    <nav class="side-nav" id="side-nav"></nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <!-- 3. പ്രധാന ഉള്ളടക്കം -->
    <main class="container page-container">
        
        <!-- *** പുതിയ കാറ്റഗറി ലേഔട്ട് *** -->
        <div class="category-page-layout" id="category-page-layout">
            
            <!-- 3.1 ഇടത് വശം: കാറ്റഗറി സൈഡ്ബാർ -->
            <aside class="category-sidebar" id="category-sidebar">
                <ul class="category-sidebar-list" id="category-sidebar-list">
                    <!-- 'categories.js' വഴി കാറ്റഗറികൾ ഇവിടെ വരും -->
                    <div class="loading-placeholder-full">Loading...</div>
                </ul>
            </aside>
            
            <!-- 3.2 വലത് വശം: ഉൽപ്പന്നങ്ങൾ -->
            <div class="category-content">
                <h1 class="category-page-title" id="page-title">All Products</h1>
                
                <!-- ഉൽപ്പന്നങ്ങൾ കാണിക്കുന്ന പുതിയ ഗ്രിഡ് -->
                <div class="product-grid-new" id="product-grid">
                    <!-- 'categories.js' ഉപയോഗിച്ച് ഉൽപ്പന്നങ്ങൾ ഇവിടെ വരും -->
                </div>
                
                <!-- ഇൻഫിനിറ്റ് സ്ക്രോൾ ലോഡർ -->
                <div class="loader-container" id="infinite-scroll-loader">
                    <div class="loader-spinner"></div>
                </div>
            </div>
            
        </div>
        
    </main>

    <!-- 4. പുതിയ ഫൂട്ടർ (common.js വഴി ലോഡ് ആവും) -->
    <footer class="main-footer-new" id="main-footer"></footer>

    <!-- JS ഫയലുകൾ -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="common.js"></script>
    <script type="module" src="categories.js"></script>
</body>
</html>
