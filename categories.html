<!-- 
  ഇതാണ് Categories & Products പേജ്. categories.html
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - JR-UD-HUB</title>
    <link rel="stylesheet" href="public.css">
    <link rel="stylesheet" href="categories.css">
</head>
<body>

    <!-- 0. പേജ് ലോഡർ -->
    <div id="preloader">
        <div class="loader-logo-container">
            <img src="" alt="Loading..." id="preloader-logo" style="display: none;" />
            <div class="loader-ring"></div>
        </div>
    </div>

    <!-- 1. ഹെഡർ -->
    <header class="main-header" id="main-header"></header>
    
    <!-- 2. സൈഡ് മെനു -->
    <nav class="side-nav" id="side-nav"></nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <!-- 3. പ്രധാന ഉള്ളടക്കം -->
    <main class="container page-container">
        
        <!-- 3.1 പേജ് ഹെഡർ -->
        <div class="page-header-bar">
            <h1>Explore Products</h1>
        </div>

        <!-- 3.2 കാറ്റഗറി ഫിൽട്ടർ ബട്ടണുകൾ -->
        <div class="category-filter-container">
            <div class="category-filter-scroll" id="category-filter-scroll">
                <!-- categories.js വഴി ഫിൽട്ടർ ബട്ടണുകൾ ഇവിടെ വരും -->
            </div>
        </div>

        <!-- 3.3 പ്രൊഡക്ടുകളുടെ ഗ്രിഡ് -->
        <div class="products-grid" id="products-grid">
            <!-- categories.js വഴി പ്രൊഡക്ടുകൾ ഇവിടെ വരും -->
        </div>

    </main>

    <!-- 4. ഫൂട്ടർ -->
    <footer class="main-footer-new" id="main-footer"></footer>

    <!-- 5. ഫ്ലോട്ടിംഗ് ഐക്കണുകൾ -->
    <div id="floating-action-buttons"></div>

    <!-- JS ഫയലുകൾ -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="common.js"></script>
    <script type="module" src="categories.js"></script>
</body>
</html>
