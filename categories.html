<!-- 
  ഇതാണ് കാറ്റഗറി പേജ്. 
  'index.html' പോലെ, ഇതും 'public.css'-ഉം 'common.js'-ഉം ഉപയോഗിക്കുന്നു.
  ഈ പേജിന് മാത്രമായി 'categories.js' എന്ന ഫയലുമുണ്ട്.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Al Ambar Perfumes</title>
    <!-- പൊതുവായ ഡിസൈൻ ഫയൽ -->
    <link rel="stylesheet" href="public.css">
</head>
<body>

    <!-- 1. പുതിയ ഹെഡർ (common.js വഴി ലോഡ് ആവും) -->
    <header class="main-header" id="main-header"></header>
    
    <!-- 2. വശത്തുള്ള മെനു (common.js വഴി ലോഡ് ആവും) -->
    <nav class="side-nav" id="side-nav"></nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <!-- 3. പ്രധാന ഉള്ളടക്കം -->
    <main class="container page-container">
        <!-- പേജിന്റെ തലക്കെട്ട് (categories.js വഴി മാറും) -->
        <div class="page-header-bar">
            <h1 id="page-title">All Products</h1>
        </div>

        <!-- ഉൽപ്പന്നങ്ങൾ കാണിക്കുന്ന ഗ്രിഡ് -->
        <div class="product-grid" id="product-grid">
            <div class="loading-placeholder-full">Loading products...</div>
            <!-- 'categories.js' ഉപയോഗിച്ച് ഉൽപ്പന്നങ്ങൾ ഇവിടെ വരും -->
        </div>
    </main>

    <!-- 4. പുതിയ ഫൂട്ടർ (common.js വഴി ലോഡ് ആവും) -->
    <footer class="main-footer" id="main-footer"></footer>

    <!-- JS ഫയലുകൾ -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="common.js"></script>
    <script type="module" src="categories.js"></script>
</body>
</html>
