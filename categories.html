<!-- 
  ഇതാണ് കാറ്റഗറി പേജ്. 
  *** പുതിയ ലേഔട്ട്: സൈഡ്ബാർ + പ്രൊഡക്റ്റ് ഗ്രിഡ് ***
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Al Ambar Perfumes</title>
    <!-- പൊതുവായ ഡിസൈൻ ഫയൽ -->
    <link rel="stylesheet" href="public.css">
</head>
<body>

    <!-- 1. പുതിയ ഹെഡർ (common.js വഴി ലോഡ് ആവും) -->
    <header class="main-header" id="main-header"></header>
    
    <!-- 2. വശത്തുള്ള മെനു (common.js വഴി ലോഡ് ആവും) -->
    <nav class="side-nav" id="side-nav"></nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <!-- 3. പ്രധാന ഉള്ളടക്കം (പുതിയ ലേഔട്ട്) -->
    <main class="container page-container">
        
        <!-- *** പുതിയ ലേഔട്ട് ഗ്രിഡ് *** -->
        <div class="category-page-layout">
            
            <!-- 1. കാറ്റഗറി സൈഡ്ബാർ -->
            <aside class="category-sidebar" id="category-sidebar-nav">
                <div class="loading-placeholder-full">Loading categories...</div>
                <!-- 'categories.js' ഉപയോഗിച്ച് കാറ്റഗറികൾ ഇവിടെ വരും -->
            </aside>

            <!-- 2. ഉൽപ്പന്നങ്ങൾ കാണിക്കുന്ന ഭാഗം -->
            <div class="category-product-content">
                <h1 id="page-title" class="category-page-title">Loading...</h1>
                
                <!-- ഉൽപ്പന്നങ്ങൾ കാണിക്കുന്ന ഗ്രിഡ് -->
                <div class="product-grid-new" id="product-grid">
                    <div class="loading-placeholder-full">Loading products...</div>
                    <!-- 'categories.js' ഉപയോഗിച്ച് ഉൽപ്പന്നങ്ങൾ ഇവിടെ വരും -->
                </div>

                <!-- ഇൻഫിനിറ്റ് സ്ക്രോൾ ലോഡർ -->
                <div id="infinite-scroll-loader" class="loader-container">
                    <div class="loader-spinner"></div>
                </div>
                
                <!-- ഉൽപ്പന്നങ്ങൾ തീരുമ്പോൾ കാണിക്കാൻ -->
                <div id="no-more-products" class="end-of-list-message" style="display: none;">
                    You've reached the end of the list.
                </div>
            </div>
        </div>
    </main>

    <!-- 4. പുതിയ ഫൂട്ടർ (common.js വഴി ലോഡ് ആവും) -->
    <footer class="main-footer" id="main-footer"></footer>

    <!-- JS ഫയലുകൾ -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="common.js"></script>
    <script type="module" src="categories.js"></script>
</body>
</html>
