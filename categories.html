<!-- 
  ഇതാണ് കാറ്റഗറി പേജ്. categories.html
  മാറ്റം: Scroll ചെയ്യുമ്പോൾ ചുരുങ്ങുന്ന ഹെഡർ ഘടന.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - JR-UD-HUB</title>
    <link rel="stylesheet" href="public.css">
    <link rel="stylesheet" href="categories.css"> 
</head>
<body>

    <!-- 0. പേജ് ലോഡർ -->
    <div id="preloader">
        <div class="loader-logo-container">
            <img src="" alt="Loading..." id="preloader-logo" style="display: none;" />
            <div class="loader-ring"></div>
        </div>
    </div>

    <!-- 1. ഹെഡർ -->
    <header class="main-header" id="main-header"></header>
    
    <!-- 2. സൈഡ് മെനു -->
    <nav class="side-nav" id="side-nav"></nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <!-- 3. പ്രധാന ഉള്ളടക്കം -->
    <main class="container page-container">
        
        <div class="category-page-layout">
            
            <!-- *** STICKY HEADER CONTAINER *** -->
            <div id="sticky-header-container" class="sticky-header-container">
                
                <!-- 3.1 കാറ്റഗറി ഗ്രിഡ് -->
                <div class="category-grid-section" id="category-nav-section">
                    <!-- JS വഴി ഇവിടെ കാറ്റഗറികൾ വരും -->
                    <span class="loading-placeholder">Loading...</span>
                </div>

                <!-- 3.0 സെർച്ച് ബാർ -->
                <div class="search-bar-container">
                    <div class="search-input-wrapper" id="search-wrapper">
                        <svg class="search-icon" id="search-icon-btn" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" id="product-search-input" placeholder="Search...">
                        <button id="clear-search-btn" style="display: none;">&times;</button>
                    </div>
                </div>

                <!-- ഫിൽറ്റർ സെക്ഷൻ -->
                <div class="filter-section">
                    <!-- വരി 1: പ്രൈസ് റേഞ്ചും സോർട്ടിംഗും -->
                    <div class="filter-row-main">
                        <div class="custom-select-wrapper">
                            <select id="price-range-filter" class="filter-select">
                                <option value="all">Price: All</option>
                                <option value="0-500">Under ₹500</option>
                                <option value="500-1000">₹500 - ₹1000</option>
                                <option value="1000-2000">₹1000 - ₹2000</option>
                                <option value="2000-5000">₹2000 - ₹5000</option>
                                <option value="5000+">Above ₹5000</option>
                            </select>
                        </div>
                        
                        <div class="custom-select-wrapper">
                            <select id="sort-by-filter" class="filter-select">
                                <option value="default">Sort By</option>
                                <option value="low-high">Price: Low to High</option>
                                <option value="high-low">Price: High to Low</option>
                            </select>
                        </div>
                    </div>

                    <!-- വരി 2: ഡിസ്കൗണ്ട് ചിപ്പുകൾ -->
                    <div class="filter-row-discount">
                        <span class="filter-label">Discount:</span>
                        <div class="discount-chips-container" id="discount-filters">
                            <!-- ടെക്സ്റ്റ് മാറ്റി -->
                            <button class="discount-chip" data-value="10">10% above</button>
                            <button class="discount-chip" data-value="25">25% above</button>
                            <button class="discount-chip" data-value="35">35% above</button>
                            <button class="discount-chip" data-value="50">50% above</button>
                            <button class="discount-chip" data-value="60">60% above</button>
                            <button class="discount-chip" data-value="70">70% above</button>
                        </div>
                    </div>
                </div>
            </div> 
            <!-- End Sticky Header -->

            <!-- 3.2 ഉൽപ്പന്നങ്ങൾ കാണിക്കുന്ന ഗ്രിഡ് -->
            <div class="category-page-content" id="products-scroll-container">
                <div class="category-product-grid" id="category-product-grid">
                    <div class="loading-placeholder-full">Loading products...</div>
                </div>
                
                <div class="loader-container" id="infinite-scroll-loader" style="display: none;">
                    <div class="loader-small"></div>
                </div>
                
                <div id="no-results-message" style="display: none; text-align: center; padding: 3rem 1rem; color: var(--text-muted);">
                    <p style="font-size: 1.1rem; margin-bottom: 0.5rem;">No products found.</p>
                    <button id="reset-filters-btn" class="btn btn-secondary-new">Reset Filters</button>
                </div>
            </div>

        </div>
    </main>

    <!-- 4. ഫൂട്ടർ -->
    <footer class="main-footer-new" id="main-footer"></footer>

    <!-- 5. ഫ്ലോട്ടിംഗ് ഐക്കണുകൾ -->
    <div id="floating-action-buttons"></div>

    <!-- JS ഫയലുകൾ -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="common.js"></script>
    <script type="module" src="categories.js"></script>
</body>
</html>
