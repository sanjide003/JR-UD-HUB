<!-- 
  ഇതാണ് കാറ്റഗറി പേജ്. 
  *** JS ഫയലുമായി പ്രവർത്തിക്കാൻ ID-കൾ ശരിയാക്കി ***
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Al Ambar Perfumes</title>
    <!-- പൊതുവായ ഡിസൈൻ ഫയൽ -->
    <link rel="stylesheet" href="public.css">
</head>
<body>

    <!-- 1. ഹെഡർ (common.js വഴി ലോഡ് ആവും) -->
    <header class="main-header" id="main-header"></header>
    
    <!-- 2. വശത്തുള്ള മെനു (common.js വഴി ലോഡ് ആവും) -->
    <nav class="side-nav" id="side-nav"></nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <!-- 3. പ്രധാന ഉള്ളടക്കം (പുതിയ ലേഔട്ട്) -->
    <main class="container page-container">
        <!-- പേജിന്റെ തലക്കെട്ട് -->
        <div class="page-header-bar">
            <h1 id="page-title">All Products</h1>
        </div>

        <!-- പുതിയ കാറ്റഗറി പേജ് ലേഔട്ട് -->
        <div class="category-page-layout">
            
            <!-- 3.1 മൊബൈലിന് മുകളിലുള്ള ബാർ -->
            <!-- *** ID-കൾ ശരിയാക്കി (categories.js-മായി യോജിപ്പിച്ചു) *** -->
            <aside class="category-sidebar-mobile" id="category-sidebar-mobile">
                <nav class="category-sidebar-nav" id="category-nav-mobile">
                    <!-- 'categories.js' ഉപയോഗിച്ച് കാറ്റഗറികൾ ഇവിടെ വരും -->
                    <span class="loading-placeholder">Loading categories...</span>
                </nav>
            </aside>
            
            <!-- 3.2 ഡെസ്ക്ടോപ്പിന് ഇടതുവശത്തുള്ള സൈഡ്ബാർ -->
            <!-- *** ID-കൾ ശരിയാക്കി (categories.js-മായി യോജിപ്പിച്ചു) *** -->
            <aside class="category-sidebar-desktop" id="category-sidebar-desktop">
                <nav class="category-sidebar-nav" id="category-nav-desktop">
                    <!-- 'categories.js' ഉപയോഗിച്ച് കാറ്റഗറികൾ ഇവിടെ വരും -->
                    <span class="loading-placeholder">Loading categories...</span>
                </nav>
            </aside>

            <!-- 3.3 ഉൽപ്പന്നങ്ങൾ കാണിക്കുന്ന ഗ്രിഡ് -->
            <div class="category-product-grid-wrapper">
                <!-- *** ID-കൾ ശരിയാക്കി (categories.js-മായി യോജിപ്പിച്ചു) *** -->
                <div class="category-product-grid" id="category-product-grid">
                    <!-- 'categories.js' ഉപയോഗിച്ച് ഉൽപ്പന്നങ്ങൾ ഇവിടെ വരും -->
                    <div class="loading-placeholder-full">Loading products...</div>
                </div>
                <!-- ഇൻഫിനിറ്റ് സ്ക്രോൾ ലോഡർ -->
                <div id="infinite-scroll-loader" style="display: none;">
                    <div class="loader-small"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- 4. ഫൂട്ടർ (common.js വഴി ലോഡ് ആവും) -->
    <footer class="main-footer-new" id="main-footer"></footer>

    <!-- 5. ഫ്ലോട്ടിംഗ് ഐക്കണുകൾ (common.js വഴി ഇവിടെ വരും) -->
    <div id="floating-action-buttons"></div>

    <!-- JS ഫയലുകൾ -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="common.js"></script>
    <script type="module" src="categories.js"></script>
</body>
</html>
