<!-- 
  ഇതാണ് കാറ്റഗറി പേജ്. categories.html
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - JR-UD-HUB</title>
    <link rel="stylesheet" href="public.css">
    <link rel="stylesheet" href="categories.css"> 
</head>
<body>

    <!-- 0. പേജ് ലോഡർ -->
    <div id="preloader">
        <div class="loader-logo-container">
            <img src="" alt="Loading..." id="preloader-logo" style="display: none;" />
            <div class="loader-ring"></div>
        </div>
    </div>

    <!-- 1. ഹെഡർ -->
    <header class="main-header" id="main-header"></header>
    
    <!-- 2. സൈഡ് മെനു -->
    <nav class="side-nav" id="side-nav"></nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <!-- 3. പ്രധാന ഉള്ളടക്കം -->
    <main class="container page-container">
        
        <!-- കാറ്റഗറി പേജ് ലേഔട്ട് -->
        <div class="category-page-layout">
            
            <!-- 3.0 സെർച്ച് ബാർ (പുതിയത്) -->
            <div class="search-bar-container">
                <div class="search-input-wrapper">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="product-search-input" placeholder="Search by Name, Price, Category, Spec...">
                    <button id="clear-search-btn" style="display: none;">&times;</button>
                </div>
            </div>

            <!-- 3.1 കാറ്റഗറി ഗ്രിഡ് -->
            <div class="category-grid-mobile" id="category-nav-mobile">
                <span class="loading-placeholder">Loading categories...</span>
            </div>
            
            <div class="category-grid-desktop" id="category-nav-desktop">
                <span class="loading-placeholder">Loading categories...</span>
            </div>

            <!-- 3.2 ഉൽപ്പന്നങ്ങൾ കാണിക്കുന്ന ഗ്രിഡ് -->
            <div class="category-page-content">
                <div class="category-product-grid" id="category-product-grid">
                    <div class="loading-placeholder-full">Loading products...</div>
                </div>
                
                <div class="loader-container" id="infinite-scroll-loader" style="display: none;">
                    <div class="loader-small"></div>
                </div>
                <!-- സെർച്ച് ഫലങ്ങൾ ഇല്ലെങ്കിൽ കാണിക്കാൻ -->
                <div id="no-results-message" style="display: none; text-align: center; padding: 2rem; color: var(--text-muted);">
                    No products found matching your search.
                </div>
            </div>

        </div>
    </main>

    <!-- 4. ഫൂട്ടർ -->
    <footer class="main-footer-new" id="main-footer"></footer>

    <!-- 5. ഫ്ലോട്ടിംഗ് ഐക്കണുകൾ -->
    <div id="floating-action-buttons"></div>

    <!-- JS ഫയലുകൾ -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="common.js"></script>
    <script type="module" src="categories.js"></script>
</body>
</html>
