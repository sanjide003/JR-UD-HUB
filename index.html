<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR-UD-HUB | Luxury Perfumes & More</title>
    
    <link rel="stylesheet" href="public.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>

    <!-- Loader -->
    <div id="preloader">
        <div class="loader-logo-container">
            <div class="loader-ring"></div>
            <img src="" alt="" id="preloader-logo" style="position:absolute; width:40px; height:40px; object-fit:contain; display:none;">
        </div>
    </div>

    <header class="main-header" id="main-header"></header>
    <div class="nav-overlay" id="nav-overlay"></div>

    <main>
        <!-- Hero Slider -->
        <section class="hero-section-new reveal-on-scroll">
            <div class="swiper hero-slider-new" id="hero-slider-container">
                <div class="swiper-wrapper" id="hero-slider-wrapper">
                    <!-- Slides JS -->
                </div>
                <div class="swiper-pagination hero-pagination-dots"></div>
            </div>
        </section>

        <!-- Banner (Optional) -->
        <div class="container reveal-on-scroll" id="home-top-banner" style="display: none; margin-bottom: 3rem;"></div>

        <!-- 1. CATALOGUE (Categories) -->
        <section class="home-section container reveal-on-scroll">
            <div class="section-header-card">
                <h2 class="section-title-card">Collections</h2>
            </div>
            <div class="swiper category-swiper">
                <div class="swiper-wrapper" id="category-grid-home"></div>
            </div>
        </section>

        <!-- 2. SPECIAL OFFER (Blue) -->
        <section class="home-section container reveal-on-scroll blue-theme" id="top-deals-section" style="display:none;">
            <div class="section-header-card">
                <h2 class="section-title-card" style="background: linear-gradient(to right, #5baaf9, #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Special Offers</h2>
            </div>
            <div id="top-deals-banner-container" class="section-banner-inside"></div>
            <div class="product-slider-container">
                <div class="swiper top-deals-swiper">
                    <div class="swiper-wrapper" id="top-deals-grid"></div>
                </div>
            </div>
        </section>

        <!-- 3. TOP TRENDY (Orange) -->
        <section class="home-section container reveal-on-scroll orange-theme">
            <div class="section-header-card">
                <h2 class="section-title-card" style="background: linear-gradient(to right, #ff9f43, #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Trending Now</h2>
            </div>
            <div class="product-slider-container">
                <div class="swiper top-sellers-swiper-new">
                    <div class="swiper-wrapper" id="top-sellers-grid"></div>
                </div>
            </div>
        </section>

        <!-- 4. TOP DISCOUNTS -->
        <section class="home-section container reveal-on-scroll">
             <div class="section-header-card">
                <h2 class="section-title-card">Best Deals</h2>
            </div>
            <div class="product-slider-container">
                <div class="swiper discount-swiper">
                    <div class="swiper-wrapper" id="top-discount-grid"></div>
                </div>
            </div>
        </section>

    </main>

    <footer class="main-footer-new" id="main-footer"></footer>
    <div id="floating-action-buttons"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="common.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
