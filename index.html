<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR-UD-HUB | Premium Shopping</title>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="public.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>

    <!-- 0. Page Loader -->
    <div id="preloader">
        <div class="loader-logo-container">
            <img src="" alt="Loading..." id="preloader-logo" style="display: none;" />
            <div class="loader-ring"></div>
        </div>
    </div>

    <!-- 1. Header -->
    <header class="main-header" id="main-header"></header>
    
    <!-- 2. Nav Overlay -->
    <div class="nav-overlay" id="nav-overlay"></div>

    <!-- 3. Main Content -->
    <main>
        
        <!-- Home Top Banner -->
        <section id="home-top-banner" class="home-top-banner animate-entry" style="display: none; animation-delay: 0.1s;"></section>

        <!-- 3.1. Hero Slider -->
        <section class="hero-section-new animate-entry" style="animation-delay: 0.2s;">
            <div class="swiper hero-slider-new" id="hero-slider-container">
                <div class="swiper-wrapper" id="hero-slider-wrapper">
                    <!-- Slides loaded via JS -->
                </div>
                <div class="swiper-pagination hero-pagination-dots"></div>
            </div>
        </section>

        <!-- 3.5. CATALOGUE (Circular Swiper) - Moved Up for Better UX -->
        <section class="home-section container animate-entry" style="animation-delay: 0.3s;">
            <h2 class="section-title-new" style="color:var(--primary-gold); text-align:center; margin-bottom:25px; letter-spacing: 2px;">CATALOGUE</h2>
            <div class="swiper category-swiper">
                <div class="swiper-wrapper" id="category-grid-home">
                    <!-- Categories loaded via JS -->
                </div>
            </div>
        </section>

        <!-- 3.2. SPECIAL OFFER -->
        <section class="home-section container animate-entry" id="top-deals-section" style="display:none; animation-delay: 0.4s;">
            <div class="section-header-card blue-card-bg">
                <h2 class="section-title-card">Special Offers</h2>
                <div id="top-deals-banner-container" class="section-banner-inside"></div>
            </div>
            
            <div class="product-slider-container blue-container">
                <div class="swiper top-deals-swiper">
                    <div class="swiper-wrapper" id="top-deals-grid">
                        <!-- Products loaded via JS -->
                    </div>
                </div>
            </div>
        </section>

        <!-- 3.3. TOP TRENDY DEALS -->
        <section class="home-section container animate-entry" style="animation-delay: 0.5s;">
            <div class="section-header-card orange-card-bg">
                <h2 class="section-title-card">Trending Now</h2>
            </div>
            
            <div class="product-slider-container orange-container">
                <div class="swiper top-sellers-swiper-new">
                    <div class="swiper-wrapper" id="top-sellers-grid">
                        <!-- Products loaded via JS -->
                    </div>
                </div>
            </div>
        </section>

        <!-- 3.4. TOP DISCOUNT OF THE SALE -->
        <section class="home-section container orange-section animate-entry" style="animation-delay: 0.6s;">
             <div class="section-header-card dark-card-bg">
                <h2 class="section-title-card">Mega Discounts</h2>
            </div>
            <div class="product-slider-container">
                <div class="swiper discount-swiper">
                    <div class="swiper-wrapper" id="top-discount-grid">
                        <!-- Products loaded via JS -->
                    </div>
                </div>
            </div>
        </section>
        
    </main>

    <!-- 4. Footer -->
    <footer class="main-footer-new" id="main-footer"></footer>

    <!-- 5. Floating Icons -->
    <div id="floating-action-buttons"></div>

    <!-- JS Files -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="common.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
