<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - JR-UD-HUB</title>
    <!-- Styles -->
    <link rel="stylesheet" href="public.css">
    <link rel="stylesheet" href="home.css">
    <!-- Swiper CSS (Optional for banners) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>

    <!-- Preloader -->
    <div id="preloader">
        <div class="loader-logo-container">
            <div class="loader-ring"></div>
        </div>
    </div>

    <!-- Header -->
    <header class="main-header" id="main-header"></header>
    
    <!-- Sidebar -->
    <nav class="side-nav" id="side-nav"></nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <main class="container home-container">
        
        <!-- Hero Banner -->
        <div id="home-banner-container" class="hero-section" style="display: none;">
            <!-- Banner image will be loaded here -->
        </div>

        <!-- Featured Products -->
        <section class="home-section">
            <div class="section-header">
                <h2 class="section-title">Latest Arrivals</h2>
                <a href="explore.html" class="view-all-link">View All</a>
            </div>
            
            <div class="home-product-grid" id="home-products-grid">
                <div class="home-loader">Loading products...</div>
            </div>
        </section>

        <!-- Categories Section (Optional) -->
        <section class="home-section" style="margin-top: 2rem;">
            <div class="section-header">
                <h2 class="section-title">Shop by Category</h2>
                <a href="categories.html" class="view-all-link">All Categories</a>
            </div>
            <div id="home-categories-container" style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px;">
                <!-- Categories loaded via JS -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="main-footer-new" id="main-footer"></footer>

    <!-- Floating Actions -->
    <div id="floating-action-buttons"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="common.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
