<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR-UD-HUB</title>
    
    <link rel="stylesheet" href="public.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>

    <!-- 0. പേജ് ലോഡർ -->
    <div id="preloader">
        <div class="loader-logo-container">
            <img src="" alt="Loading..." id="preloader-logo" style="display: none;" />
            <div class="loader-ring"></div>
        </div>
    </div>

    <!-- 1. ഹെഡർ -->
    <header class="main-header" id="main-header"></header>
    
    <!-- 2. സൈഡ് മെനു -->
    <div class="nav-overlay" id="nav-overlay"></div>

    <!-- 3. പ്രധാന ഉള്ളടക്കം -->
    <main>
        
        <!-- 3.0. STICKY CATEGORY BAR (New) -->
        <div id="sticky-category-header" class="home-sticky-header">
            <div class="category-scroll-wrapper" id="home-category-list">
                <!-- Categories from index.js -->
                <div class="loading-placeholder-small">Loading...</div>
            </div>
        </div>

        <!-- ഹോം പേജ് ടോപ്പ് ബാനർ -->
        <section id="home-top-banner" class="home-top-banner" style="display: none;"></section>

        <!-- 3.1. ഹീറോ സ്ലൈഡർ -->
        <section class="hero-section-new">
            <div class="swiper hero-slider-new" id="hero-slider-container">
                <div class="swiper-wrapper" id="hero-slider-wrapper">
                    <!-- Slides from index.js -->
                </div>
                <div class="swiper-pagination hero-pagination-dots"></div>
            </div>
        </section>

        <!-- 3.2. TOP DEALS (New Section controlled by Admin) -->
        <section class="home-section container" id="top-deals-section" style="display:none;">
            <h2 class="section-title-new">Top Deals on Tech</h2>
            <!-- Admin Uploaded Banner -->
            <div id="top-deals-banner-container" class="section-banner-box"></div>
            
            <!-- Top Deals Products Slider -->
            <div class="product-slider-container blue-theme">
                <div class="swiper top-deals-swiper">
                    <div class="swiper-wrapper" id="top-deals-grid"></div>
                </div>
            </div>
        </section>

        <!-- 3.3. TOP TRENDY DEALS (Renamed from For You) -->
        <section class="home-section container">
            <h2 class="section-title-new" style="color: #ff6b6b;">Top Trendy Deals</h2> <!-- Red/Orange Title -->
            <div class="swiper top-sellers-swiper-new">
                <div class="swiper-wrapper" id="top-sellers-grid">
                    <!-- Products from index.js -->
                </div>
            </div>
            <div class="top-sellers-pagination-new"></div>
        </section>

        <!-- 3.4. TOP DISCOUNT OF THE SALE (Automated) -->
        <section class="home-section container orange-section">
            <h2 class="section-title-new">Top Discount of the Sale</h2>
            <div class="swiper discount-swiper">
                <div class="swiper-wrapper" id="top-discount-grid">
                    <!-- Auto generated high discount products -->
                </div>
            </div>
        </section>
        
    </main>

    <!-- 4. ഫൂട്ടർ -->
    <footer class="main-footer-new" id="main-footer"></footer>

    <!-- 5. ഫ്ലോട്ടിംഗ് ഐക്കണുകൾ -->
    <div id="floating-action-buttons"></div>

    <!-- JS ഫയലുകൾ -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="common.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
