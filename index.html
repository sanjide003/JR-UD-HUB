<!-- 
  ഇതാണ് ഹോം പേജ്. 
  *** Mute/Unmute ബട്ടൺ പൂർണ്ണമായും നീക്കം ചെയ്തു ***
  *** പുതിയ പേജ് ലോഡർ ചേർത്തു ***
  *** 'FEATURED' സെക്ഷൻ നീക്കം ചെയ്തു ***
  *** ടോപ്പ് സെല്ലർ ഡോട്ടുകൾ സ്ലൈഡറിന് പുറത്താക്കി ***
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al Ambar Perfumes - Luxury Arabic Perfumes</title>
    
    <link rel="stylesheet" href="public.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>

    <!-- 0. പേജ് ലോഡർ -->
    <div id="preloader">
        <div class="loader-logo-container">
            <!-- ലോഗോയും സ്പിന്നറും common.js & public.css വഴി വരും -->
            <img src="" alt="Loading..." id="preloader-logo" style="display: none;" />
            <div class="loader-ring"></div>
        </div>
    </div>

    <!-- 1. ഹെഡർ -->
    <header class="main-header" id="main-header"></header>
    
    <!-- 2. സൈഡ് മെനു -->
    <nav class="side-nav" id="side-nav"></nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <!-- 3. പ്രധാന ഉള്ളടക്കം -->
    <main>
        
        <!-- 3.1. ഹീറോ സ്ലൈഡർ (പോർട്രെയ്റ്റ്) -->
        <section class="hero-section-new">
            <div class="swiper hero-slider-new" id="hero-slider-container">
                <div class="swiper-wrapper" id="hero-slider-wrapper">
                    <!-- 'index.js' ഉപയോഗിച്ച് സ്ലൈഡുകൾ (വീഡിയോ/ഫോട്ടോ) ഇവിടെ വരും -->
                </div>
                <!-- ഡോട്ടുകൾ (Pagination) -->
                <div class="swiper-pagination hero-pagination-dots"></div>
            </div>
            
            <!-- *** Mute/Unmute ബട്ടൺ ഇവിടെ നിന്ന് നീക്കം ചെയ്തു *** -->

        </section>

        <!-- 3.2. ഹീറോ ടെക്സ്റ്റ് -->
        <section class="hero-text-section container">
            <p>We believe that a perfumer is a poet or a storyteller who use intangible ingredients to create emotions. The main idea behind Oud Arabia is to Abstract memories that evoke our cores. We paint pictures without using paint. We are storytellers who do need words.</p>
        </section>

        <!-- 3.3. ടോപ്പ് സെല്ലേഴ്സ് -->
        <section class="home-section container">
            <h2 class="section-title-new">TOP SELLERS</h2>
            <div class="swiper top-sellers-swiper-new">
                <div class="swiper-wrapper" id="top-sellers-grid">
                    <!-- 'index.js' ഉപയോഗിച്ച് ഉൽപ്പന്നങ്ങൾ ഇവിടെ വരും -->
                </div>
            </div>
            <!-- *** ആനിമേറ്റഡ് ഡോട്ടുകൾ (പുതിയത്) *** -->
            <div class="top-sellers-pagination-new swiper-pagination-custom"></div>
        </section>

        <!-- 3.4. ഷോപ്പ് ബൈ കാറ്റഗറി -->
        <section class="home-section container">
            <h2 class="section-title-new">SHOP BY CATEGORY</h2>
            <div class="swiper category-swiper-new">
                <div class="swiper-wrapper" id="category-grid-home">
                    <!-- 'index.js' ഉപയോഗിച്ച് കാറ്റഗറികൾ (swiper-slide ആയി) ഇവിടെ വരും -->
                </div>
            </div>
        </section>
        
        <!-- *** 3.5. ഫീച്ചേർഡ് സെക്ഷൻ നീക്കം ചെയ്തു *** -->
        
    </main>

    <!-- 4. ഫൂട്ടർ -->
    <footer class="main-footer-new" id="main-footer"></footer>

    <!-- 5. ഫ്ലോട്ടിംഗ് ഐക്കണുകൾ -->
    <div id="floating-action-buttons"></div>

    <!-- JS ഫയലുകൾ -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="common.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
