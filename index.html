<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR-UD-HUB</title>
    <link rel="stylesheet" href="public.css">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>
<body>
    <div id="preloader"><div class="loader-ring"></div></div>
    <header class="main-header" id="main-header"></header>
    <main>
        <section id="home-top-banner" class="home-top-banner" style="display: none;"></section>
        
        <section class="hero-section">
            <div class="swiper hero-slider" id="hero-slider-container">
                <div class="swiper-wrapper" id="hero-slider-wrapper"></div>
                <div class="swiper-pagination"></div>
            </div>
        </section>

        <section class="container" style="text-align:center; padding: 2rem 1rem; color:#aaa;">
            <p>We believe that a perfumer is a poet or a storyteller...</p>
        </section>

        <section class="container home-section">
            <h2 class="section-title-new">For You</h2>
            <div class="swiper top-sellers-swiper">
                <div class="swiper-wrapper" id="top-sellers-grid"></div>
            </div>
        </section>

        <section class="container home-section">
            <h2 class="section-title-new">Shop By Category</h2>
            <div id="category-grid-home" class="category-grid-simple"></div>
        </section>
    </main>
    <footer class="main-footer-new" id="main-footer"></footer>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
