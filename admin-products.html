<!-- Filename: admin-products.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Manager - JR-UD-HUB</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div id="toast-container"></div>

    <!-- Login Section -->
    <section id="login-section">
        <div class="container">
            <div class="form-section" style="max-width: 400px; margin: 5rem auto;">
                <h2 style="text-align: center;">Admin Login</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn btn-save">Login</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Admin Panel -->
    <section id="admin-panel" class="hidden">
        <header class="admin-main-header">
            <button id="nav-open-btn" style="background:none; border:none; color:#fff; cursor:pointer;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <h1>Products & Categories</h1>
            <div style="width:24px"></div>
        </header>

        <!-- Navigation Sidebar -->
        <nav id="side-nav" class="admin-side-nav">
            <div class="admin-nav-header">
                <h3>Menu</h3>
                <button id="nav-close-btn" style="background:none; border:none; color:#aaa; cursor:pointer;">✕</button>
            </div>
            <div class="admin-nav-links">
                <div class="nav-section-title">Products</div>
                <button class="nav-link active" data-target="tab-add-product">Add New Product</button>
                <button class="nav-link" data-target="tab-existing-products">Existing Products</button>

                <div class="nav-section-title">Categories</div>
                <button class="nav-link" data-target="tab-add-category">Add New Category</button>
                <button class="nav-link" data-target="tab-existing-categories">Existing Categories</button>

                <div class="nav-section-title">Switch Dashboard</div>
                <!-- Link to the other HTML file -->
                <a href="admin-settings.html" class="nav-page-link">Go to Site Settings &rarr;</a>
                
                <button id="logout-btn" class="btn btn-delete" style="width:90%; margin: 20px auto; display:flex;">Logout</button>
            </div>
        </nav>
        <div id="nav-overlay" class="admin-nav-overlay"></div>

        <div class="container">
            
            <!-- 1. Add Product -->
            <div id="tab-add-product" class="page-content active">
                <form id="add-product-form" class="form-section">
                    <h2>Add New Product</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Product Name *</label>
                            <input type="text" id="p-name" required>
                        </div>
                        <div class="form-group">
                            <label>Category *</label>
                            <select id="p-category" required><option>Loading...</option></select>
                        </div>
                        <div class="form-group">
                            <label>MRP (₹)</label>
                            <input type="number" id="p-mrp">
                        </div>
                        <div class="form-group">
                            <label>Selling Price (₹) *</label>
                            <input type="number" id="p-price" required>
                        </div>
                        <div class="form-group full-width">
                            <label style="display:flex; align-items:center; gap:10px;">
                                <input type="checkbox" id="p-featured" style="width:20px; height:20px;"> 
                                Add to Top Trendy (Featured)
                            </label>
                        </div>
                        <div class="form-group full-width">
                            <label>Description</label>
                            <textarea id="p-desc" rows="3"></textarea>
                        </div>
                        <div class="form-group full-width">
                            <label>Specification</label>
                            <textarea id="p-spec" rows="3"></textarea>
                        </div>
                        <div class="form-group full-width">
                            <label>Images (URLs) *</label>
                            <div id="p-images-container"></div>
                            <button type="button" id="btn-add-img" class="btn btn-secondary mt-large">Add Image URL</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-save">Save Product</button>
                </form>
            </div>

            <!-- 2. Existing Products -->
            <div id="tab-existing-products" class="page-content">
                <div class="form-section">
                    <h2>Existing Products</h2>
                    <div class="form-group">
                        <label>Filter by Category</label>
                        <select id="filter-category"><option value="all">All</option></select>
                    </div>
                    <div class="data-table-wrapper">
                        <table class="data-table">
                            <thead><tr><th>Img</th><th>Name</th><th>Price</th><th>Action</th></tr></thead>
                            <tbody id="products-list"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 3. Add Category -->
            <div id="tab-add-category" class="page-content">
                <form id="add-category-form" class="form-section">
                    <h2>Add Category</h2>
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="c-name" required>
                    </div>
                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="text" id="c-image" required>
                    </div>
                    <button type="submit" class="btn btn-save">Add Category</button>
                </form>
            </div>

            <!-- 4. Existing Categories -->
            <div id="tab-existing-categories" class="page-content">
                <div class="form-section">
                    <h2>Categories List</h2>
                    <div class="data-table-wrapper">
                        <table class="data-table">
                            <thead><tr><th>Img</th><th>Name</th><th>Action</th></tr></thead>
                            <tbody id="categories-list"></tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="admin-products.js"></script>
</body>
</html>
