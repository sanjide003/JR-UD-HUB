<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Al Ambar Perfumes</title>
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS STYLES --- */
        :root {
            --bg-color: #121212;
            --primary-gold: #D4AF37;
            --text-color: #F5F5F5;
            --text-muted: #aaa;
            --card-bg: #1e1e1e;
            --error-red: #e74c3c;
            --success-green: #2ecc71;
            --font-main: 'Inter', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 2rem;
        }

        /* --- Login Box --- */
        .login-box {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 8px;
            border: 1px solid #333;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        
        #login-section h1 {
            text-align: center;
            color: var(--primary-gold);
            margin-bottom: 2rem;
        }

        /* --- Admin Panel --- */
        #admin-panel {
            display: none; /* ലോഗിൻ ചെയ്ത ശേഷം മാത്രം കാണിക്കും */
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--secondary-gold);
            padding-bottom: 1rem;
        }
        
        .admin-header h1 {
            color: var(--primary-gold);
            margin-bottom: 0;
        }

        /* --- Form Elements --- */
        .form-section {
            background-color: var(--card-bg);
            padding: 1.5rem 2rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 1px solid #333;
        }
        
        .form-section h2 {
            color: var(--text-color);
            border-bottom: 1px solid #444;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 0.85rem;
            border-radius: 5px;
            border: 1px solid #555;
            background-color: #333;
            color: var(--text-color);
            font-family: var(--font-main);
            font-size: 1rem;
            box-sizing: border-box; /* Important */
        }
        
        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* --- Buttons --- */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 1rem;
            background-color: var(--primary-gold);
            color: #000;
            font-weight: 700;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            text-align: center;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #b8860b;
        }
        
        .btn-logout {
            background-color: var(--error-red);
            color: #fff;
            padding: 0.5rem 1rem;
            width: auto;
        }

        /* --- Status Messages --- */
        .status-message {
            padding: 1rem;
            border-radius: 5px;
            margin-top: 1rem;
            text-align: center;
            font-weight: 500;
            display: none; /* JS വഴി കാണിക്കും */
        }
        
        .status-message.error {
            background-color: rgba(231, 76, 60, 0.2);
            color: var(--error-red);
            display: block;
        }
        
        .status-message.success {
            background-color: rgba(46, 204, 113, 0.2);
            color: var(--success-green);
            display: block;
        }
        
        /* Loading Spinner */
        .loader {
            border: 4px solid #555;
            border-top: 4px solid var(--primary-gold);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .container {
                margin: 0 auto;
                padding: 1rem;
            }
            .login-box { padding: 1.5rem; }
            .form-section { padding: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 1. Login Section -->
        <section id="login-section">
            <div class="login-box">
                <h1>Admin Login</h1>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn" id="login-button">Login</button>
                    <div id="login-status" class="status-message"></div>
                </form>
            </div>
        </section>

        <!-- 2. Admin Panel Section (Hidden by default) -->
        <section id="admin-panel">

            <div class="admin-header">
                <h1>Admin Panel</h1>
                <button id="logout-button" class="btn btn-logout">Logout</button>
            </div>
            
            <div id="admin-status" class="status-message"></div>

            <!-- Add Category Form -->
            <form id="add-category-form" class="form-section">
                <h2>Add New Category</h2>
                <div class="form-group">
                    <label for="category-name">Category Name</label>
                    <input type="text" id="category-name" placeholder="e.g., Attar, Bakhoor" required>
                </div>
                
                <!-- *** മാറ്റം ഇവിടെ *** -->
                <div class="form-group">
                    <label for="category-image-url">Category Image URL</label>
                    <input type="text" id="category-image-url" placeholder="Paste image URL from Imgur, etc." required>
                </div>
                
                <button type="submit" class="btn" id="add-category-button">Add Category</button>
                <div class="loader" id="category-loader"></div>
            </form>

            <!-- Add Product Form -->
            <form id="add-product-form" class="form-section">
                <h2>Add New Product</h2>
                
                <div class="form-group">
                    <label for="product-category">Category</label>
                    <select id="product-category" required>
                        <option value="">Select a category...</option>
                        <!-- കാറ്റഗറികൾ ഫയർബേസിൽ നിന്ന് ഇവിടെ ലോഡ് ആവും -->
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="product-name">Product Name</label>
                    <input type="text" id="product-name" required>
                </div>
                
                <div class="form-group">
                    <label for="product-sku">SKU (Unique ID)</label>
                    <input type="text" id="product-sku" placeholder="e.g., OA-12" required>
                </div>
                
                <div class="form-group">
                    <label for="product-size">Size</label>
                    <input type="text" id="product-size" placeholder="e.g., 12ml">
                </div>
                
                <div class="form-group">
                    <label for="product-price">Price (in AED)</label>
                    <input type="number" id="product-price" placeholder="e.g., 250">
                </div>
                
                <div class="form-group">
                    <label for="product-description">Description</label>
                    <textarea id="product-description" rows="4"></textarea>
                </div>
                
                <!-- *** മാറ്റം ഇവിടെ *** -->
                <div class="form-group">
                    <label for="product-image-urls">Product Image URLs (One URL per line)</label>
                    <textarea id="product-image-urls" rows="4" placeholder="Paste image links here, each on a new line." required></textarea>
                </div>

                <div class="form-group">
                    <input type="checkbox" id="product-featured" style="width: auto; margin-right: 10px;">
                    <label for="product-featured" style="display: inline;">Featured on Home Page?</label>
                </div>

                <button type="submit" class="btn" id="add-product-button">Add Product</button>
                <div class="loader" id="product-loader"></div>
            </form>

        </section>
    </div>

    <!-- Firebase SDK (v11 Modular) -->
    <!-- Firestore and Auth മാത്രം മതി. Storage SDK നീക്കം ചെയ്തു. -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            serverTimestamp,
            getDocs,
            setLogLevel
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // നിങ്ങളുടെ ഫയർബേസ് കോൺഫിഗറേഷൻ
        const firebaseConfig = {
            apiKey: "AIzaSyCePcVE_BTiFuYXAApNmbMKHdkhQ9Ay_F4",
            authDomain: "al-ambar-perfume-company.firebaseapp.com",
            projectId: "al-ambar-perfume-company",
            storageBucket: "al-ambar-perfume-company.firebasestorage.app", // ഇത് ഇവിടെ থাকলেও നമ്മൾ ഉപയോഗിക്കുന്നില്ല
            messagingSenderId: "992506041633",
            appId: "1:992506041633:web:f7277461a577248bb8da60",
            measurementId: "G-39XB0WLW6P"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        setLogLevel('Debug');

        // --- DOM Elements ---
        const loginSection = document.getElementById("login-section");
        const adminPanel = document.getElementById("admin-panel");
        const loginForm = document.getElementById("login-form");
        const loginButton = document.getElementById("login-button");
        const loginStatus = document.getElementById("login-status");
        const logoutButton = document.getElementById("logout-button");
        const adminStatus = document.getElementById("admin-status");
        
        const addCategoryForm = document.getElementById("add-category-form");
        const categoryLoader = document.getElementById("category-loader");
        
        const addProductForm = document.getElementById("add-product-form");
        const productCategorySelect = document.getElementById("product-category");
        const productLoader = document.getElementById("product-loader");

        // --- Helper Functions ---
        function showStatus(element, message, isError = true) {
            element.textContent = message;
            element.className = isError ? 'status-message error' : 'status-message success';
        }
        function clearStatus(element) {
            element.textContent = '';
            element.className = 'status-message';
        }

        // --- 1. Authentication Logic ---
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            clearStatus(loginStatus);
            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";

            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Auth state change (താഴെ) ബാക്കി കാര്യങ്ങൾ നോക്കിക്കോളും
            } catch (error) {
                console.error("Login Error:", error);
                showStatus(loginStatus, `Login Failed: ${error.message}`);
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });

        logoutButton.addEventListener("click", () => {
            signOut(auth);
        });

        // Auth State Change Listener (ലോഗിൻ ആയോ ഇല്ലയോ എന്ന് നോക്കുന്നു)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in
                loginSection.style.display = "none";
                adminPanel.style.display = "block";
                loadCategoriesForSelect(); // അഡ്മിൻ പാനലിലെ ഡ്രോപ്പ്ഡൗൺ ലോഡ് ചെയ്യുന്നു
            } else {
                // User is signed out
                loginSection.style.display = "block";
                adminPanel.style.display = "none";
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });

        // --- 2. Load Categories into Product Form Dropdown ---
        async function loadCategoriesForSelect() {
            try {
                const querySnapshot = await getDocs(collection(db, "categories"));
                productCategorySelect.innerHTML = '<option value="">Select a category...</option>'; // Clear
                querySnapshot.forEach((doc) => {
                    const category = doc.data();
                    const option = document.createElement('option');
                    option.value = doc.id; // We use the Document ID
                    option.textContent = category.name;
                    productCategorySelect.appendChild(option);
                });
            } catch (error) {
                console.error("Error loading categories for select:", error);
                showStatus(adminStatus, "Error loading categories dropdown.");
            }
        }

        // --- 3. Add Category Logic (Storage ഇല്ലാതെ) ---
        addCategoryForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            clearStatus(adminStatus);
            categoryLoader.style.display = 'block';
            addCategoryForm.querySelector('button').disabled = true;

            const name = document.getElementById("category-name").value;
            const imageUrl = document.getElementById("category-image-url").value;

            if (!name || !imageUrl) {
                showStatus(adminStatus, "Please fill in all category fields.");
                categoryLoader.style.display = 'none';
                addCategoryForm.querySelector('button').disabled = false;
                return;
            }

            try {
                // നേരെ ഫയർസ്റ്റോറിലേക്ക് സേവ് ചെയ്യുന്നു
                await addDoc(collection(db, "categories"), {
                    name: name,
                    imageUrl: imageUrl, // അപ്‌ലോഡ് ചെയ്യുന്നതിന് പകരം ലിങ്ക് സേവ് ചെയ്യുന്നു
                    createdAt: serverTimestamp()
                });
                
                showStatus(adminStatus, "Category added successfully!", false);
                addCategoryForm.reset();
                loadCategoriesForSelect(); // ഡ്രോപ്പ്ഡൗൺ റീഫ്രഷ് ചെയ്യുന്നു

            } catch (error) {
                console.error("Error adding category: ", error);
                showStatus(adminStatus, `Error: ${error.message}`);
            } finally {
                categoryLoader.style.display = 'none';
                addCategoryForm.querySelector('button').disabled = false;
            }
        });

        // --- 4. Add Product Logic (Storage ഇല്ലാതെ) ---
        addProductForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            clearStatus(adminStatus);
            productLoader.style.display = 'block';
            addProductForm.querySelector('button').disabled = true;

            try {
                const categoryId = productCategorySelect.value;
                const name = document.getElementById("product-name").value;
                const sku = document.getElementById("product-sku").value;
                const size = document.getElementById("product-size").value;
                const price = document.getElementById("product-price").value;
                const description = document.getElementById("product-description").value;
                const featured = document.getElementById("product-featured").checked;
                
                // *** മാറ്റം ഇവിടെ ***
                // ടെക്സ്റ്റ് ഏരിയയിൽ നിന്ന് ലിങ്കുകൾ എടുക്കുന്നു
                const imageUrlsText = document.getElementById("product-image-urls").value;
                const imageUrls = imageUrlsText.split('\n')
                                            .map(url => url.trim())
                                            .filter(url => url.length > 0); // ഒഴിഞ്ഞ ലൈനുകൾ ഒഴിവാക്കുന്നു

                if (!categoryId || !name || !sku || imageUrls.length === 0) {
                    throw new Error("Category, Name, SKU, and at least one Image URL are required.");
                }

                // നേരെ ഫയർസ്റ്റോറിലേക്ക് സേവ് ചെയ്യുന്നു
                await addDoc(collection(db, "products"), {
                    categoryId: categoryId,
                    name: name,
                    sku: sku,
                    size: size,
                    price: Number(price),
                    description: description,
                    featured: featured,
                    images: imageUrls, // അപ്‌ലോഡ് ചെയ്ത ലിങ്കുകൾക്ക് പകരം പേസ്റ്റ് ചെയ്ത ലിങ്കുകൾ
                    createdAt: serverTimestamp()
                });
                
                showStatus(adminStatus, "Product added successfully!", false);
                addProductForm.reset();

            } catch (error) {
                console.error("Error adding product: ", error);
                showStatus(adminStatus, `Error: ${error.message}`);
            } finally {
                productLoader.style.display = 'none';
                addProductForm.querySelector('button').disabled = false;
            }
        });

    </script>

</body>
</html>
