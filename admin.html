<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Al Ambar Perfumes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --primary-color: #D4AF37; /* Gold */
            --secondary-color: #121212; /* Dark */
            --text-color: #333;
            --text-light: #F5F5F5;
            --border-color: #ddd;
            --card-bg: #ffffff;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --font-main: 'Inter', sans-serif;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
        }
        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        * { box-sizing: border-box; }
        .container {
            width: 100%;
            max-width: 1100px;
            margin: 2rem auto;
            padding: 1.5rem;
        }

        /* --- Login Form --- */
        #login-container {
            max-width: 450px;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border-top: 5px solid var(--primary-color);
        }
        #login-container h1 {
            text-align: center;
            color: var(--secondary-color);
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: var(--font-main);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.9rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .btn-primary {
            background-color: var(--primary-color);
            color: var(--secondary-color);
        }
        .btn-primary:hover {
            background-color: #c19d30; /* Darker Gold */
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
        }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .btn-danger:hover { background-color: #c0392b; }
        .btn-secondary { background-color: #7f8c8d; color: white; }
        .btn-secondary:hover { background-color: #6c7a7b; }
        .btn-small { padding: 0.4rem 0.8rem; font-size: 0.8rem; width: auto; }
        
        #error-message {
            color: var(--danger-color);
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.2);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            text-align: center;
            margin-top: 1.5rem;
            display: none;
        }
        #success-message {
            color: #27ae60;
            background: rgba(46, 204, 113, 0.1);
            border: 1px solid rgba(46, 204, 113, 0.2);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            text-align: center;
            margin-top: 1.5rem;
            display: none;
        }

        /* --- Admin Panel --- */
        #admin-panel {
            display: none; /* Initially hidden */
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }
        .admin-header h1 {
            color: var(--secondary-color);
            font-size: 1.5rem;
        }
        .admin-header #admin-email {
            font-size: 0.9rem;
            color: #555;
            margin-right: 1.5rem;
        }
        #logout-button {
            background: none;
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #logout-button:hover {
            background: var(--danger-color);
            color: white;
        }

        /* --- Tabs --- */
        .tab-navigation {
            display: flex;
            margin-bottom: 2rem;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 0.5rem;
        }
        .tab-btn {
            flex: 1;
            padding: 1rem;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: #555;
            border-radius: 8px;
            transition: all 0.3s ease;
            position: relative;
        }
        .tab-btn.active {
            background-color: var(--primary-color);
            color: var(--secondary-color);
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* --- Form & Table Layout --- */
        .admin-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        .form-container, .list-container {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }
        .form-container h2, .list-container h2 {
            font-size: 1.5rem;
            color: var(--secondary-color);
            margin-top: 0;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1rem;
        }
        
        /* Single column layout for Site Settings */
        #tab-settings .admin-layout {
            grid-template-columns: 1fr;
        }

        .form-group textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: var(--font-main);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            min-height: 100px;
            resize: vertical;
        }
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
        }
        
        .form-group select {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            font-family: var(--font-main);
            background-color: white;
            cursor: pointer;
        }
        
        .form-group label .required-star {
            color: var(--danger-color);
            font-weight: 700;
            margin-left: 4px;
        }

        .form-group .image-preview {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            border: 2px dashed var(--border-color);
            margin-top: 1rem;
            object-fit: cover;
            background-color: #f9f9f9;
        }
        
        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }
        .form-actions .btn { width: 100%; }

        .list-container ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 600px;
            overflow-y: auto;
        }
        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .list-item-content {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .list-item-img {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }
        .list-item-info {
            display: flex;
            flex-direction: column;
        }
        .list-item-info strong {
            font-size: 1rem;
            color: var(--secondary-color);
            font-weight: 500;
        }
        .list-item-info span {
            font-size: 0.85rem;
            color: #666;
        }
        .list-item-actions {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        
        #loading-indicator {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.7);
            z-index: 9998;
            justify-content: center;
            align-items: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .admin-layout {
                grid-template-columns: 1fr;
            }
            .list-container {
                order: -1; /* Show list on top */
            }
        }
        @media (max-width: 600px) {
            .container {
                padding: 1rem;
                margin: 0;
            }
            #login-container, .form-container, .list-container {
                padding: 1.5rem;
            }
            .admin-header {
                flex-direction: column;
                gap: 1rem;
            }
            .tab-navigation {
                flex-direction: column;
            }
            .list-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .list-item-actions {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Loading Spinner -->
    <div id="loading-indicator">
        <div class="spinner"></div>
    </div>

    <!-- Login Container -->
    <div id="login-container" class="container">
        <h1>Admin Login</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
            <div id="error-message"></div>
        </form>
    </div>

    <!-- Admin Panel (Hidden by default) -->
    <div id="admin-panel" class="container">
        <header class="admin-header">
            <h1>Al Ambar - Admin Panel</h1>
            <div>
                <span id="admin-email"></span>
                <button id="logout-button">Logout</button>
            </div>
        </header>

        <!-- General Success/Error Message -->
        <div id="success-message"></div>

        <!-- Tab Navigation -->
        <nav class="tab-navigation">
            <button class="tab-btn active" data-tab="tab-products">Manage Products</button>
            <button class="tab-btn" data-tab="tab-categories">Manage Categories</button>
            <button class="tab-btn" data-tab="tab-settings">Site Settings</button>
        </nav>

        <!-- Tab 1: Manage Products -->
        <div id="tab-products" class="tab-content active">
            <div class="admin-layout">
                <div class="form-container">
                    <h2 id="product-form-title">Add New Product</h2>
                    <form id="product-form">
                        <input type="hidden" id="product-id">
                        <div class="form-group">
                            <label for="product-name">Product Name <span class="required-star">*</span></label>
                            <input type="text" id="product-name" required>
                        </div>
                        <div class="form-group">
                            <label for="product-sku">SKU <span class="required-star">*</span></label>
                            <input type="text" id="product-sku" required>
                        </div>
                        <div class="form-group">
                            <label for="product-category">Category <span class="required-star">*</span></label>
                            <select id="product-category" required>
                                <option value="">Select a category</option>
                                <!-- Categories loaded by JS -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="product-price">Price in ₹ <span class="required-star">*</span></label>
                            <input type="number" id="product-price" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="product-desc">Description</label>
                            <textarea id="product-desc" rows="4"></textarea>
                        </div>
                         <!-- New Fields -->
                        <div class="form-group">
                            <label for="product-fragrance">Fragrance Classification</label>
                            <input type="text" id="product-fragrance" placeholder="e.g., Woody, Floral, Oriental">
                        </div>
                        <div class="form-group">
                            <label for="product-ideal">Ideal For</label>
                            <input type="text" id="product-ideal" placeholder="e.g., Men, Women, Unisex">
                        </div>
                        <div class="form-group">
                            <label for="product-video">Product Video URL (YouTube or .mp4)</label>
                            <input type="url" id="product-video">
                        </div>
                        <!-- End New Fields -->
                        <div class="form-group">
                            <label for="product-image1">Image 1 URL</label>
                            <input type="url" id="product-image1" class="image-url-input" data-preview="preview-img1">
                            <img src="https://placehold.co/100x100/f4f7f6/ccc?text=Preview" id="preview-img1" class="image-preview" alt="Image 1 Preview">
                        </div>
                        <div class="form-group">
                            <label for="product-image2">Image 2 URL</label>
                            <input type="url" id="product-image2" class="image-url-input" data-preview="preview-img2">
                            <img src="https://placehold.co/100x100/f4f7f6/ccc?text=Preview" id="preview-img2" class="image-preview" alt="Image 2 Preview">
                        </div>
                        <div class="form-group">
                            <label for="product-featured">
                                <input type="checkbox" id="product-featured" style="width: auto; margin-right: 10px;">
                                Feature this product on Home Page
                            </label>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Save Product</button>
                            <button type="button" id="clear-product-form" class="btn btn-secondary">Clear</button>
                        </div>
                    </form>
                </div>
                <div class="list-container">
                    <h2>Existing Products</h2>
                    <ul id="product-list">
                        <!-- Products loaded by JS -->
                    </ul>
                </div>
            </div>
        </div>

        <!-- Tab 2: Manage Categories -->
        <div id="tab-categories" class="tab-content">
            <div class="admin-layout">
                <div class="form-container">
                    <h2 id="category-form-title">Add New Category</h2>
                    <form id="category-form">
                        <input type="hidden" id="category-id">
                        <div class="form-group">
                            <label for="category-name">Category Name <span class="required-star">*</span></label>
                            <input type="text" id="category-name" required>
                        </div>
                        <div class="form-group">
                            <label for="category-image">Image URL</label>
                            <input type="url" id="category-image" class="image-url-input" data-preview="preview-cat-img">
                            <img src="https://placehold.co/100x100/f4f7f6/ccc?text=Preview" id="preview-cat-img" class="image-preview" alt="Category Image Preview">
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Save Category</button>
                            <button type="button" id="clear-category-form" class="btn btn-secondary">Clear</button>
                        </div>
                    </form>
                </div>
                <div class="list-container">
                    <h2>Existing Categories</h2>
                    <ul id="category-list">
                        <!-- Categories loaded by JS -->
                    </ul>
                </div>
            </div>
        </div>

        <!-- Tab 3: Site Settings -->
        <div id="tab-settings" class="tab-content">
            <div class="admin-layout">
                <div class="form-container">
                    <h2>Site-Wide Settings</h2>
                    <p style="margin-top: -1.5rem; margin-bottom: 2rem; color: #555;">Changes here will update the header, footer, and home page.</p>
                    <form id="settings-form">
                        <div class="form-group">
                            <label for="setting-logo">Logo Text (Header)</label>
                            <input type="text" id="setting-logo" placeholder="e.g., Al Ambar">
                        </div>
                        <div class="form-group">
                            <label for="setting-video">Home Page Video URL (YouTube or .mp4)</label>
                            <input type="url" id="setting-video" placeholder="https://www.youtube.com/watch?v=...">
                        </div>
                        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 2rem 0;">
                        <h3>Contact & Footer Settings</h3>
                        <div class="form-group">
                            <label for="setting-whatsapp">WhatsApp Number (with country code)</label>
                            <input type="text" id="setting-whatsapp" placeholder="e.g., 918086081985 (without +)">
                        </div>
                        <div class="form-group">
                            <label for="setting-phone">Phone Number (for Footer)</label>
                            <input type="text" id="setting-phone" placeholder="e.g., +91 80860 81985">
                        </div>
                        <div class="form-group">
                            <label for="setting-email">Email Address (for Footer)</label>
                            <input type="email" id="setting-email" placeholder="e.g., info@alambar.com">
                        </div>
                        <div class="form-group">
                            <label for="setting-address">Address (for Footer)</label>
                            <input type="text" id="setting-address" placeholder="e.g., Kochi, Kerala">
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">Save Settings</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            addDoc, 
            getDoc, 
            getDocs, 
            setDoc, 
            updateDoc, 
            deleteDoc, 
            onSnapshot,
            query,
            orderBy,
            setLogLevel
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCePcVE_BTiFuYXAApNmbMKHdkhQ9Ay_F4",
            authDomain: "al-ambar-perfume-company.firebaseapp.com",
            projectId: "al-ambar-perfume-company",
            storageBucket: "al-ambar-perfume-company.firebasestorage.app",
            messagingSenderId: "992506041633",
            appId: "1:992506041633:web:f7277461a577248bb8da60",
            measurementId: "G-39XB0WLW6P"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        setLogLevel('Debug'); // ലോഗുകൾ കാണാൻ

        // DOM Elements
        const loginContainer = document.getElementById("login-container");
        const adminPanel = document.getElementById("admin-panel");
        const loginForm = document.getElementById("login-form");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const errorMessage = document.getElementById("error-message");
        const successMessage = document.getElementById("success-message");
        const logoutButton = document.getElementById("logout-button");
        const adminEmailSpan = document.getElementById("admin-email");
        const loadingIndicator = document.getElementById("loading-indicator");
        
        const tabButtons = document.querySelectorAll(".tab-btn");
        const tabContents = document.querySelectorAll(".tab-content");
        
        // Category Form
        const categoryForm = document.getElementById("category-form");
        const categoryFormTitle = document.getElementById("category-form-title");
        const categoryIdInput = document.getElementById("category-id");
        const categoryNameInput = document.getElementById("category-name");
        const categoryImageInput = document.getElementById("category-image");
        const categoryList = document.getElementById("category-list");
        const clearCategoryFormBtn = document.getElementById("clear-category-form");
        const categoryPreview = document.getElementById("preview-cat-img");

        // Product Form
        const productForm = document.getElementById("product-form");
        const productFormTitle = document.getElementById("product-form-title");
        const productIdInput = document.getElementById("product-id");
        const productNameInput = document.getElementById("product-name");
        const productSkuInput = document.getElementById("product-sku");
        const productCategorySelect = document.getElementById("product-category");
        const productPriceInput = document.getElementById("product-price");
        const productDescInput = document.getElementById("product-desc");
        const productFragranceInput = document.getElementById("product-fragrance");
        const productIdealInput = document.getElementById("product-ideal");
        const productVideoInput = document.getElementById("product-video");
        const productImage1Input = document.getElementById("product-image1");
        const productImage2Input = document.getElementById("product-image2");
        const productFeaturedInput = document.getElementById("product-featured");
        const productList = document.getElementById("product-list");
        const clearProductFormBtn = document.getElementById("clear-product-form");

        // Settings Form
        const settingsForm = document.getElementById("settings-form");
        const settingLogoInput = document.getElementById("setting-logo");
        const settingVideoInput = document.getElementById("setting-video");
        const settingWhatsappInput = document.getElementById("setting-whatsapp");
        const settingPhoneInput = document.getElementById("setting-phone");
        const settingEmailInput = document.getElementById("setting-email");
        const settingAddressInput = document.getElementById("setting-address");
        
        // --- Utility Functions ---
        function showLoading() { loadingIndicator.style.display = 'flex'; }
        function hideLoading() { loadingIndicator.style.display = 'none'; }
        
        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            setTimeout(() => { successMessage.style.display = 'none'; }, 3000);
        }
        function showLoginError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }
        
        function clearProductForm() {
            productForm.reset();
            productIdInput.value = '';
            productFormTitle.textContent = 'Add New Product';
            document.querySelectorAll('.image-preview').forEach(img => {
                img.src = 'https://placehold.co/100x100/f4f7f6/ccc?text=Preview';
            });
        }
        
        function clearCategoryForm() {
            categoryForm.reset();
            categoryIdInput.value = '';
            categoryFormTitle.textContent = 'Add New Category';
            categoryPreview.src = 'https://placehold.co/100x100/f4f7f6/ccc?text=Preview';
        }
        
        // --- Authentication ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in
                loginContainer.style.display = 'none';
                adminPanel.style.display = 'block';
                adminEmailSpan.textContent = user.email;
                // Load initial data
                loadCategories();
                loadProducts();
                loadSiteSettings();
            } else {
                // User is signed out
                loginContainer.style.display = 'block';
                adminPanel.style.display = 'none';
                adminEmailSpan.textContent = '';
            }
        });

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            showLoading();
            const email = emailInput.value;
            const password = passwordInput.value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Auth state change will handle UI
                errorMessage.style.display = 'none';
            } catch (error) {
                console.error("Login Error: ", error);
                showLoginError(`Login Failed: ${error.message}`);
            }
            hideLoading();
        });

        logoutButton.addEventListener("click", async () => {
            showLoading();
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Logout Error: ", error);
            }
            hideLoading();
        });

        // --- Tab Navigation ---
        tabButtons.forEach(button => {
            button.addEventListener("click", () => {
                // Deactivate all
                tabButtons.forEach(btn => btn.classList.remove("active"));
                tabContents.forEach(content => content.classList.remove("active"));
                
                // Activate clicked
                button.classList.add("active");
                document.getElementById(button.dataset.tab).classList.add("active");
            });
        });
        
        // --- Image Preview ---
        document.querySelectorAll('.image-url-input').forEach(input => {
            input.addEventListener('input', (e) => {
                const previewId = e.target.dataset.preview;
                const previewImg = document.getElementById(previewId);
                if (e.target.value) {
                    previewImg.src = e.target.value;
                    previewImg.onerror = () => {
                        previewImg.src = 'https://placehold.co/100x100/f4f7f6/ccc?text=Invalid';
                    };
                } else {
                    previewImg.src = 'https://placehold.co/100x100/f4f7f6/ccc?text=Preview';
                }
            });
        });

        // --- Categories CRUD ---
        
        // Save/Update Category
        categoryForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showLoading();
            const categoryId = categoryIdInput.value;
            const categoryData = {
                name: categoryNameInput.value,
                imageUrl: categoryImageInput.value || ''
            };
            
            try {
                if (categoryId) {
                    // Update existing
                    const docRef = doc(db, 'categories', categoryId);
                    await updateDoc(docRef, categoryData);
                    showSuccess('Category updated successfully!');
                } else {
                    // Add new
                    await addDoc(collection(db, 'categories'), categoryData);
                    showSuccess('Category added successfully!');
                }
                clearCategoryForm();
            } catch (error) {
                console.error("Error saving category: ", error);
                showLoginError("Error saving category. Check console.");
            }
            hideLoading();
        });
        
        // Load Categories
        async function loadCategories() {
            try {
                // Listen for realtime updates
                const q = query(collection(db, "categories"));
                onSnapshot(q, (querySnapshot) => {
                    categoryList.innerHTML = ''; // Clear list
                    productCategorySelect.innerHTML = '<option value="">Select a category</option>'; // Clear select
                    
                    if (querySnapshot.empty) {
                        categoryList.innerHTML = '<li>No categories found.</li>';
                        return;
                    }
                    
                    const categories = [];
                    querySnapshot.forEach((doc) => {
                        categories.push({ id: doc.id, ...doc.data() });
                    });

                    // Sort alphabetically by name
                    categories.sort((a, b) => a.name.localeCompare(b.name));
                    
                    categories.forEach((category) => {
                        const { id, name, imageUrl } = category;
                        
                        // Populate list
                        const li = document.createElement('li');
li.className = 'list-item';
li.innerHTML = `
    <div class="list-item-content">
        <img src="${imageUrl || 'https://placehold.co/50x50/f4f7f6/ccc?text=N/A'}" alt="${name}" class="list-item-img" onerror="this.src='https://placehold.co/50x50/f4f7f6/ccc?text=Error'">
        <div class="list-item-info">
            <strong>${name}</strong>
        </div>
    </div>
    <div class="list-item-actions">
        <button class="btn btn-secondary btn-small btn-edit-category" data-id="${id}">Edit</button>
        <button class="btn btn-danger btn-small btn-delete-category" data-id="${id}">Delete</button>
    </div>
`;
categoryList.appendChild(li);
                        
                        // Populate product form select
                        const option = document.createElement('option');
                        option.value = id;
                        option.textContent = name;
                        productCategorySelect.appendChild(option);
                    });
                });
            } catch (error) {
                console.error("Error loading categories: ", error);
                categoryList.innerHTML = '<li>Error loading categories.</li>';
            }
        }
        
        // Edit/Delete Category Listeners
        categoryList.addEventListener('click', async (e) => {
            const target = e.target.closest('button');
            if (!target) return;
            
            const id = target.dataset.id;
            
            if (target.classList.contains('btn-delete-category')) {
                if (confirm('Are you sure you want to delete this category? This cannot be undone.')) {
                    showLoading();
                    try {
                        await deleteDoc(doc(db, 'categories', id));
                        showSuccess('Category deleted.');
                    } catch (error) {
                        console.error("Error deleting category: ", error);
                        showLoginError("Error. See console.");
                    }
                    hideLoading();
                }
            } else if (target.classList.contains('btn-edit-category')) {
                showLoading();
                try {
                    const docRef = doc(db, 'categories', id);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        categoryIdInput.value = id;
                        categoryNameInput.value = data.name;
                        categoryImageInput.value = data.imageUrl || '';
                        categoryPreview.src = data.imageUrl || 'https://placehold.co/100x100/f4f7f6/ccc?text=Preview';
                        categoryFormTitle.textContent = 'Edit Category';
                        window.scrollTo(0, 0); // Scroll to top
                    }
                } catch (error) {
                    console.error("Error fetching category: ", error);
                    showLoginError("Error. See console.");
                }
                hideLoading();
            }
        });
        
        clearCategoryFormBtn.addEventListener('click', clearCategoryForm);

        // --- Products CRUD ---

        // Save/Update Product
        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showLoading();
            
            const productId = productIdInput.value;
            const images = [productImage1Input.value, productImage2Input.value].filter(url => url); // Filter out empty strings
            
            const productData = {
                name: productNameInput.value,
                sku: productSkuInput.value,
                categoryId: productCategorySelect.value,
                price: parseFloat(productPriceInput.value) || 0,
                description: productDescInput.value || '',
                fragrance: productFragranceInput.value || '',
                idealFor: productIdealInput.value || '',
                videoUrl: productVideoInput.value || '',
                images: images,
                featured: productFeaturedInput.checked
            };
            
            try {
                if (productId) {
                    // Update
                    const docRef = doc(db, 'products', productId);
                    await updateDoc(docRef, productData);
                    showSuccess('Product updated successfully!');
                } else {
                    // Add new
                    await addDoc(collection(db, 'products'), productData);
                    showSuccess('Product added successfully!');
                }
                clearProductForm();
            } catch (error) {
                console.error("Error saving product: ", error);
                showLoginError("Error saving product. Check console.");
            }
            hideLoading();
        });
        
        // Load Products
        async function loadProducts() {
            try {
                // Listen for realtime updates
                const q = query(collection(db, "products"));
                onSnapshot(q, (querySnapshot) => {
                    productList.innerHTML = ''; // Clear list
                    
                    if (querySnapshot.empty) {
                        productList.innerHTML = '<li>No products found.</li>';
                        return;
                    }

                    const products = [];
                    querySnapshot.forEach((doc) => {
                        products.push({ id: doc.id, ...doc.data() });
                    });

                    // Sort alphabetically by name
                    products.sort((a, b) => a.name.localeCompare(b.name));
                    
                    products.forEach((product) => {
                        const { id, name, sku, images, price } = product;
                        
                        const li = document.createElement('li');
li.className = 'list-item';
li.innerHTML = `
    <div class="list-item-content">
        <img src="${(images && images[0]) || 'https://placehold.co/50x50/f4f7f6/ccc?text=N/A'}" alt="${name}" class="list-item-img" onerror="this.src='https://placehold.co/50x50/f4f7f6/ccc?text=Error'">
        <div class="list-item-info">
            <strong>${name}</strong>
            <span>SKU: ${sku} | ₹${price}</span>
        </div>
    </div>
    <div class="list-item-actions">
        <button class="btn btn-secondary btn-small btn-edit-product" data-id="${id}">Edit</button>
        <button class="btn btn-danger btn-small btn-delete-product" data-id="${id}">Delete</button>
    </div>
`;
productList.appendChild(li);
                    });
                });
            } catch (error) {
                console.error("Error loading products: ", error);
                productList.innerHTML = '<li>Error loading products.</li>';
            }
        }
        
        // Edit/Delete Product Listeners
        productList.addEventListener('click', async (e) => {
            const target = e.target.closest('button');
            if (!target) return;
            
            const id = target.dataset.id;
            
            if (target.classList.contains('btn-delete-product')) {
                if (confirm('Are you sure you want to delete this product? This cannot be undone.')) {
                    showLoading();
                    try {
                        await deleteDoc(doc(db, 'products', id));
                        showSuccess('Product deleted.');
                    } catch (error) {
                        console.error("Error deleting product: ", error);
                        showLoginError("Error. See console.");
                    }
                    hideLoading();
                }
            } else if (target.classList.contains('btn-edit-product')) {
                showLoading();
                try {
                    const docRef = doc(db, 'products', id);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        productIdInput.value = id;
                        productNameInput.value = data.name || '';
                        productSkuInput.value = data.sku || '';
                        productCategorySelect.value = data.categoryId || '';
                        productPriceInput.value = data.price || 0;
                        productDescInput.value = data.description || '';
                        productFragranceInput.value = data.fragrance || '';
                        productIdealInput.value = data.idealFor || '';
                        productVideoInput.value = data.videoUrl || '';
                        productFeaturedInput.checked = data.featured || false;
                        
                        productImage1Input.value = data.images && data.images[0] ? data.images[0] : '';
                        productImage2Input.value = data.images && data.images[1] ? data.images[1] : '';
                        
                        // Trigger preview update
                        productImage1Input.dispatchEvent(new Event('input'));
                        productImage2Input.dispatchEvent(new Event('input'));
                        
                        productFormTitle.textContent = 'Edit Product';
                        window.scrollTo(0, 0); // Scroll to top
                    }
                } catch (error) {
                    console.error("Error fetching product: ", error);
                    showLoginError("Error. See console.");
                }
                hideLoading();
            }
        });
        
        clearProductFormBtn.addEventListener('click', clearProductForm);

        // --- Site Settings ---
        
        // Load Settings
        async function loadSiteSettings() {
            try {
                const docRef = doc(db, "settings", "global");
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    settingLogoInput.value = data.logoText || '';
                    settingVideoInput.value = data.videoUrl || '';
                    settingWhatsappInput.value = data.whatsapp || '';
                    settingPhoneInput.value = data.phone || '';
                    settingEmailInput.value = data.email || '';
                    settingAddressInput.value = data.address || '';
                }
            } catch (error) {
                console.error("Error loading settings: ", error);
            }
        }
        
        // Save Settings
        settingsForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            showLoading();
            
            const settingsData = {
                logoText: settingLogoInput.value,
                videoUrl: settingVideoInput.value,
                whatsapp: settingWhatsappInput.value,
                phone: settingPhoneInput.value,
                email: settingEmailInput.value,
                address: settingAddressInput.value
            };
            
            try {
                const docRef = doc(db, "settings", "global");
                await setDoc(docRef, settingsData, { merge: true }); // Use setDoc with merge to create if not exists
                showSuccess('Site settings saved successfully!');
            } catch (error) {
                console.error("Error saving settings: ", error);
                showLoginError("Error saving settings. See console.");
            }
            hideLoading();
        });

    </script>
</body>
</html>
