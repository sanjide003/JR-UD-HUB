<!-- 
  product.html
  Updated: Dual Related Rows & Clickable Specs
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - JR-UD-HUB</title>
    <!-- പൊതുവായ ഡിസൈൻ ഫയൽ -->
    <link rel="stylesheet" href="public.css">
    <link rel="stylesheet" href="product.css"> 
    
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    
    <style>
        /* Payment Modal Styles (Inline fallback) */
        .payment-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }
        .payment-modal-content {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 1.5rem;
            border-top: 1px solid var(--primary-gold);
            box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease-out;
        }
        body.light-mode .payment-modal-content {
            background-color: #fff;
            border-top: none;
            color: #333;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @media (min-width: 768px) {
            .payment-modal-overlay { align-items: center; }
            .payment-modal-content { border-radius: 12px; border: 1px solid var(--primary-gold); animation: fadeIn 0.2s ease-out; }
            @keyframes fadeIn { from { opacity: 0; scale: 0.95; } to { opacity: 1; scale: 1; } }
        }
        .payment-modal-title { margin: 0 0 1.5rem; color: var(--primary-gold); text-align: center; font-size: 1.3rem; }
        body.light-mode .payment-modal-title { color: var(--primary-gold); }
        .payment-options { display: flex; flex-direction: column; gap: 1rem; }
        .payment-option {
            display: flex; align-items: center; gap: 12px; padding: 12px;
            border: 1px solid var(--border-color); border-radius: 8px;
            cursor: pointer; transition: all 0.2s; background-color: rgba(255, 255, 255, 0.03);
        }
        body.light-mode .payment-option { background-color: #f9f9f9; border-color: #ddd; }
        .payment-option:hover { border-color: var(--primary-gold); }
        .payment-option input { display: none; }
        .radio-custom {
            width: 20px; height: 20px; border: 2px solid var(--text-muted);
            border-radius: 50%; position: relative;
        }
        .payment-option input:checked + .radio-custom { border-color: var(--primary-gold); }
        .payment-option input:checked + .radio-custom::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 10px; height: 10px; background-color: var(--primary-gold); border-radius: 50%;
        }
        .payment-text { display: flex; flex-direction: column; }
        .payment-name { font-weight: 600; color: var(--text-color); font-size: 1rem; }
        body.light-mode .payment-name { color: #000; }
        .payment-desc { font-size: 0.8rem; color: var(--text-muted); }
        .cod-warning-box {
            background-color: rgba(231, 76, 60, 0.1); border: 1px solid rgba(231, 76, 60, 0.3);
            color: var(--error-red); padding: 10px; border-radius: 6px; margin-top: 1rem;
            font-size: 0.85rem; text-align: center; line-height: 1.4;
        }
        .payment-actions { display: flex; gap: 1rem; margin-top: 1.5rem; }
        .payment-actions .btn { flex: 1; }
    </style>
</head>
<body>

    <!-- 0. പേജ് ലോഡർ -->
    <div id="preloader">
        <div class="loader-logo-container">
            <img src="" alt="Loading..." id="preloader-logo" style="display: none;" />
            <div class="loader-ring"></div>
        </div>
    </div>

    <!-- 1. ഹെഡർ -->
    <header class="main-header" id="main-header"></header>
    
    <!-- 2. സൈഡ് മെനു -->
    <nav class="side-nav" id="side-nav"></nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <!-- 3. പ്രധാന ഉള്ളടക്കം -->
    <main class="container product-detail-container">
        <!-- ഉൽപ്പന്നത്തിന്റെ വിവരങ്ങൾ 'product.js' വഴി ഇവിടെ വരും -->
        <div id="product-detail-content" class="product-detail-grid">
            <div class="loading-placeholder-full">Loading product...</div>
        </div>

        <!-- 4. ബന്ധപ്പെട്ട ഉൽപ്പന്നങ്ങൾ (രണ്ട് വരികൾ) -->
        <section class="related-products-section">
            
            <!-- Row 1: Same Category -->
            <h2 class="section-title-new" id="category-row-title">Similar Products</h2>
            <div class="product-grid-new" id="category-products-grid">
                <p class="loading-placeholder" style="text-align:center;">Loading similar items...</p>
            </div>

            <!-- Row 2: Random / Explore More -->
            <div id="random-products-section-wrapper" style="margin-top: 2rem; display: none;">
                <h2 class="section-title-new">Explore More</h2>
                <div class="product-grid-new" id="random-products-grid">
                    <p class="loading-placeholder" style="text-align:center;">Loading recommendations...</p>
                </div>
            </div>

        </section>

        <!-- *** PAYMENT MODAL *** -->
        <div id="payment-modal" class="payment-modal-overlay">
            <div class="payment-modal-content">
                <h3 class="payment-modal-title">Select Payment Method</h3>
                
                <div class="payment-options">
                    <label class="payment-option">
                        <input type="radio" name="payment_mode" value="online" checked>
                        <span class="radio-custom"></span>
                        <div class="payment-text">
                            <span class="payment-name">Online Payment</span>
                            <span class="payment-desc">Pay via UPI / Bank (Fast & Free)</span>
                        </div>
                    </label>
                    
                    <label class="payment-option">
                        <input type="radio" name="payment_mode" value="cod">
                        <span class="radio-custom"></span>
                        <div class="payment-text">
                            <span class="payment-name">Cash on Delivery</span>
                            <span class="payment-desc">Pay when delivered</span>
                        </div>
                    </label>
                </div>

                <div id="cod-warning-box" class="cod-warning-box" style="display: none;">
                    <p id="cod-warning-text"></p>
                </div>

                <div class="payment-actions">
                    <button id="cancel-payment-btn" class="btn btn-secondary-new">Cancel</button>
                    <button id="confirm-payment-btn" class="btn btn-primary-new">Confirm Order</button>
                </div>
            </div>
        </div>

    </main>

    <!-- 5. ഫൂട്ടർ -->
    <footer class="main-footer-new" id="main-footer"></footer>

    <!-- 6. ഫ്ലോട്ടിംഗ് ഐക്കണുകൾ -->
    <div id="floating-action-buttons"></div>

    <!-- JS ഫയലുകൾ -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="common.js"></script>
    <script type="module" src="product.js"></script>
</body>
</html>
