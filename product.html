    <!-- ... (CSS and other head tags remain the same) ... -->

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* ... (മുൻപത്തെ എല്ലാ സ്റ്റൈലുകളും ഇവിടെയുണ്ട്, മാറ്റമില്ല) ... */
        :root {
            --bg-color: #121212;
            --primary-gold: #D4AF37;
            --secondary-gold: #B8860B;
            --text-color: #F5F5F5;
            --text-muted: #aaa;
            --card-bg: #1e1e1e;
            --font-main: 'Inter', sans-serif;
        }
        body { font-family: var(--font-main); background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; margin: 0; padding: 0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .container { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem; }
        .main-header { background-color: var(--bg-color); padding: 1.5rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--secondary-gold); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.75rem; font-weight: 700; color: var(--primary-gold); letter-spacing: 1px; text-decoration: none; }
        .main-nav ul { list-style: none; display: flex; }
        .main-nav li { margin-left: 2rem; }
        .main-nav a { color: var(--text-color); font-weight: 400; text-decoration: none; transition: color 0.3s ease; }
        .main-nav a:hover, .main-nav a.active { color: var(--primary-gold); }
        .page-header { background-color: var(--card-bg); padding: 3rem 1.5rem; text-align: center; border-bottom: 1px solid var(--secondary-gold); }
        .page-header h1 { font-size: 2.5rem; color: var(--primary-gold); }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; }
        .product-card { background-color: var(--card-bg); border-radius: 8px; overflow: hidden; border: 1px solid #333; transition: all 0.3s ease; display: flex; flex-direction: column; }
        .product-card:hover { border-color: var(--secondary-gold); transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.3); }
        .product-card-image { width: 100%; height: 250px; object-fit: cover; background-color: #333; }
        .product-card-content { padding: 1.5rem; flex-grow: 1; }
        .product-card-content h3 { font-size: 1.25rem; color: var(--text-color); }
        .product-card-content .price { font-size: 1.3rem; font-weight: 700; color: var(--primary-gold); margin-bottom: 1rem; }
        .btn { display: inline-block; padding: 0.75rem 1.5rem; background-color: var(--primary-gold); color: var(--bg-color); font-weight: 700; border-radius: 5px; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; border: 2px solid var(--primary-gold); text-decoration: none; }
        .btn:hover { background-color: var(--secondary-gold); border-color: var(--secondary-gold); color: #000; }
        .loading-placeholder { text-align: center; color: var(--text-muted); font-size: 1.1rem; padding: 4rem 0; grid-column: 1 / -1; }
        .whatsapp-cta { position: fixed; bottom: 25px; right: 25px; background-color: #25D366; color: #fff; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 100; transition: transform 0.3s ease; }
        .whatsapp-cta:hover { transform: scale(1.1); }
        .whatsapp-cta svg { width: 32px; height: 32px; fill: #fff; }
        .main-footer { background-color: #000; color: var(--text-muted); padding: 4rem 1.5rem 2rem; margin-top: 3rem; border-top: 1px solid var(--secondary-gold); }
        .footer-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2.5rem; }
        .footer-col h3 { font-size: 1.5rem; color: var(--primary-gold); margin-bottom: 1.5rem; font-weight: 700; }
        .footer-col ul { list-style: none; }
        .footer-col li { margin-bottom: 0.75rem; }
        .footer-col a, .footer-col .contact-item-footer a { color: var(--text-muted); text-decoration: none; transition: color 0.3s ease; }
        .footer-col a:hover { color: var(--primary-gold); }
        .contact-item-footer { display: flex; align-items: center; margin-bottom: 1rem; }
        .contact-item-footer svg { width: 20px; height: 20px; fill: var(--primary-gold); margin-right: 1rem; flex-shrink: 0; }
        .social-icons { display: flex; gap: 1.5rem; margin-top: 1.5rem; }
        .social-icons a { display: inline-block; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--text-muted); display: flex; justify-content: center; align-items: center; transition: all 0.3s ease; }
        .social-icons a:hover { border-color: var(--primary-gold); background-color: var(--primary-gold); }
        .social-icons a:hover svg { fill: #000; }
        .social-icons svg { width: 20px; height: 20px; fill: var(--text-muted); transition: fill 0.3s ease; }
        .footer-bottom { text-align: center; margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #333; font-size: 0.9rem; }
        @media (max-width: 768px) {
            .main-header { flex-direction: column; padding: 1rem; }

            .main-nav ul { justify-content: center; flex-wrap: wrap; }

            .footer-col { text-align: center; }
            .contact-item-footer { justify-content: center; }
            .social-icons { justify-content: center; }
        }

    <script type="module">
        // ... (മുൻപത്തെ എല്ലാ JS കോഡുകളും മാറ്റമില്ലാതെ തുടരുന്നു) ...
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, query, where, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        const firebaseConfig = {
            apiKey: "AIzaSyCePcVE_BTiFuYXAApNmbMKHdkhQ9Ay_F4",
            authDomain: "al-ambar-perfume-company.firebaseapp.com",
            projectId: "al-ambar-perfume-company",
            storageBucket: "al-ambar-perfume-company.firebasestorage.app",
            messagingSenderId: "992506041633",
            appId: "1:992506041633:web:f7277461a577248bb8da60",
            measurementId: "G-39XB0WLW6P"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        setLogLevel('Debug');
        const productGrid = document.getElementById("product-grid");
        const pageTitle = document.getElementById("page-title");
        const headerLogo = document.getElementById("header-logo");
        const whatsappFloatBtn = document.getElementById("whatsapp-float-btn");
        const footerPhone = document.getElementById("footer-phone");
        const footerEmail = document.getElementById("footer-email");
        const footerAddress = document.getElementById("footer-address");
        const footerCategoryList = document.getElementById("footer-category-list");

        async function loadProducts() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const categoryId = urlParams.get('filter');
                let productsQuery;
                
                if (categoryId) {
                    try {
                        const catDoc = await getDoc(doc(db, "categories", categoryId));
                        if (catDoc.exists()) {
                            pageTitle.textContent = catDoc.data().name;
                        } else {
                            pageTitle.textContent = "Category Not Found";
                        }
                    } catch (err) {
                        pageTitle.textContent = "Products";
                    }
                    productsQuery = query(
                        collection(db, "products"),
                        where("categoryId", "==", categoryId)
                    );
                } else {
                    productsQuery = query(collection(db, "products"));
                    pageTitle.textContent = "All Products";
                }
                const querySnapshot = await getDocs(productsQuery);
                if (querySnapshot.empty) {
                    productGrid.innerHTML = '<p class="loading-placeholder">No products found in this category.</p>';
                    return;
                }
                productGrid.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const product = doc.data();
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="${product.images && product.images[0] ? product.images[0] : 'https://placehold.co/400x400/1e1e1e/D4AF37?text=No+Image'}" 
                             alt="${product.name}" 
                             class="product-card-image"
                             onerror="this.src='https://placehold.co/400x400/1e1e1e/D4AF37?text=Error'">
                        <div class="product-card-content">
                            <h3>${product.name}</h3>
                            <p class="price">${product.price || 'N/A'} AED</p>
                            <a href="product.html?sku=${product.sku}" class="btn">View Details</a>
                        </div>
                    `;
                    productGrid.appendChild(card);
                });
            } catch (error) {
                console.error("Error loading products: ", error);
                productGrid.innerHTML = '<p class="loading-placeholder">Error loading products. Check console for details.</p>';
            }
        }

        async function loadSiteSettings() {
            try {
                const catSnapshot = await getDocs(collection(db, "categories"));
                footerCategoryList.innerHTML = '';
                catSnapshot.forEach((doc) => {
                    const category = doc.data();
                    const footerLink = document.createElement('li');
                    footerLink.innerHTML = `<a href="categories.html?filter=${doc.id}">${category.name}</a>`;
                    footerCategoryList.appendChild(footerLink);
                });
                const docRef = doc(db, "settings", "global");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const settings = docSnap.data();
                    if (settings.logoText) {
                        headerLogo.textContent = settings.logoText;
                    }
                    if (settings.whatsapp) {
                        whatsappFloatBtn.href = `https://wa.me/${settings.whatsapp}?text=Hello%20Al%20Ambar`;
                    }
                    if (settings.phone) {
                        footerPhone.textContent = settings.phone;
                        footerPhone.href = `tel:${settings.phone}`;
                    }
                    if (settings.email) {
                        footerEmail.textContent = settings.email;
                        footerEmail.href = `mailto:${settings.email}`;
                    }
                    if (settings.address) {
                        footerAddress.textContent = settings.address;
                    }
                } else {
                    console.log("No site settings found.");
                }
            } catch (error) {
                console.error("Error loading site settings: ", error);
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadSiteSettings();
            loadProducts();
        });
    </script>
