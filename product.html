<!-- 
  ഇതാണ് ഉൽപ്പന്നം വിശദമായി കാണിക്കുന്ന പേജ്.
  'public.css', 'common.js' എന്നിവയോടൊപ്പം 'product.js' എന്ന ഫയലും ഉപയോഗിക്കുന്നു.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Al Ambar Perfumes</title>
    <!-- പൊതുവായ ഡിസൈൻ ഫയൽ -->
    <link rel="stylesheet" href="public.css">
</head>
<body>

    <!-- 1. പുതിയ ഹെഡർ (common.js വഴി ലോഡ് ആവും) -->
    <header class="main-header" id="main-header"></header>
    
    <!-- 2. വശത്തുള്ള മെനു (common.js വഴി ലോഡ് ആവും) -->
    <nav class="side-nav" id="side-nav"></nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <!-- 3. പ്രധാന ഉള്ളടക്കം -->
    <main class="container product-detail-container">
        <!-- ഉൽപ്പന്നത്തിന്റെ വിവരങ്ങൾ 'product.js' വഴി ഇവിടെ വരും -->
        <div id="product-detail-content" class="product-detail-grid">
            <div class="loading-placeholder-full">Loading product...</div>
        </div>

        <!-- 4. ബന്ധപ്പെട്ട ഉൽപ്പന്നങ്ങൾ (Related Products) -->
        <section class="related-products-section">
            <h2 class="section-title">You May Also Like</h2>
            <div class="product-grid" id="related-products-grid">
                <!-- ബന്ധപ്പെട്ട ഉൽപ്പന്നങ്ങൾ 'product.js' വഴി ഇവിടെ വരും -->
            </div>
        </section>
    </main>

    <!-- 5. പുതിയ ഫൂട്ടർ (common.js വഴി ലോഡ് ആവും) -->
    <footer class="main-footer" id="main-footer"></footer>

    <!-- JS ഫയലുകൾ -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="common.js"></script>
    <script type="module" src="product.js"></script>
</body>
</html>
