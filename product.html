<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Al Ambar Perfumes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* (പഴയ സ്റ്റൈലുകൾ മാറ്റമില്ലാതെ തുടരുന്നു) */
        :root {
            --bg-color: #121212;
            --primary-gold: #D4AF37;
            --secondary-gold: #B8860B;
            --text-color: #F5F5F5;
            --text-muted: #aaa;
            --card-bg: #1e1e1e;
            --font-main: 'Inter', sans-serif;
            --border-color: #333;
            --discount-red: #e74c3c; /* ഡിസ്കൗണ്ടിന് നിറം */
        }
        body { font-family: var(--font-main); background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; margin: 0; padding: 0; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .container { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem; }
        .main-header { background-color: var(--bg-color); padding: 1.5rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--secondary-gold); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.75rem; font-weight: 700; color: var(--primary-gold); letter-spacing: 1px; text-decoration: none; }
        .main-nav ul { list-style: none; display: flex; }
        .main-nav li { margin-left: 2rem; }
        .main-nav a { color: var(--text-color); font-weight: 400; text-decoration: none; transition: color 0.3s ease; }
        .main-nav a:hover, .main-nav a.active { color: var(--primary-gold); }
        .btn { display: inline-block; padding: 0.75rem 1.5rem; background-color: var(--primary-gold); color: var(--bg-color); font-weight: 700; border-radius: 5px; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; border: 2px solid var(--primary-gold); text-decoration: none; }
        .btn:hover { background-color: var(--secondary-gold); border-color: var(--secondary-gold); color: #000; }
        .loading-placeholder { text-align: center; color: var(--text-muted); font-size: 1.1rem; padding: 4rem 0; grid-column: 1 / -1; }
        
        /* *** ഉൽപ്പന്ന പേജിനുള്ള പുതിയ സ്റ്റൈലുകൾ *** */
        .product-detail-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        @media (min-width: 768px) {
            .product-detail-container {
                grid-template-columns: 1fr 1fr;
                gap: 3rem;
            }
        }
        
        /* ഇമേജ് ഗാലറി */
        .product-gallery {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }
        .gallery-main-image {
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }
        .gallery-thumbnails {
            display: flex;
            gap: 10px;
            padding: 10px;
            background-color: var(--card-bg);
            overflow-x: auto;
        }
        .gallery-thumb {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 5px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }
        .gallery-thumb:hover, .gallery-thumb.active {
            border-color: var(--primary-gold);
        }

        /* ഉൽപ്പന്നത്തിന്റെ വിവരങ്ങൾ */
        .product-info h1 {
            font-size: 2.5rem;
            color: var(--text-color);
            margin-bottom: 1rem;
        }
        .product-info .product-size {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }
        
        /* *** പുതിയ വില സ്റ്റൈലുകൾ (വലുത്) *** */
        .price-container-large {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        .price-retail-large {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary-gold);
            margin-right: 0.75rem;
        }
        .price-mrp-large {
            font-size: 1.2rem;
            color: var(--text-muted);
            text-decoration: line-through;
            margin-right: 0.75rem;
        }
        .price-discount-large {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--discount-red);
            background-color: rgba(231, 76, 60, 0.1);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
        }
        /* *** /പുതിയ വില സ്റ്റൈലുകൾ *** */
        
        .product-description {
            line-height: 1.7;
        }
        .product-description h3 {
            color: var(--primary-gold);
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        
        .whatsapp-order-btn {
            margin-top: 2rem;
            background-color: #25D366; /* WhatsApp Green */
            color: #fff;
            font-weight: 700;
            padding: 1rem 1.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }
        .whatsapp-order-btn:hover {
            background-color: #128C7E;
        }
        .whatsapp-order-btn svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }

        /* *** /ഉൽപ്പന്ന പേജിനുള്ള പുതിയ സ്റ്റൈലുകൾ *** */

        .whatsapp-cta { position: fixed; bottom: 25px; right: 25px; background-color: #25D366; color: #fff; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 100; transition: transform 0.3s ease; }
        .whatsapp-cta:hover { transform: scale(1.1); }
        .whatsapp-cta svg { width: 32px; height: 32px; fill: #fff; }
        
        /* (Footer സ്റ്റൈലുകൾ മാറ്റമില്ലാതെ തുടരുന്നു) */
        .main-footer { background-color: #000; color: var(--text-muted); padding: 4rem 1.5rem 2rem; margin-top: 3rem; border-top: 1px solid var(--secondary-gold); }
        .footer-container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2.5rem; }
        .footer-col h3 { font-size: 1.5rem; color: var(--primary-gold); margin-bottom: 1.5rem; font-weight: 700; }
        .footer-col ul { list-style: none; }
        .footer-col li { margin-bottom: 0.75rem; }
        .footer-col a, .footer-col .contact-item-footer a { color: var(--text-muted); text-decoration: none; transition: color 0.3s ease; }
        .footer-col a:hover { color: var(--primary-gold); }
        .contact-item-footer { display: flex; align-items: center; margin-bottom: 1rem; }
        .contact-item-footer svg { width: 20px; height: 20px; fill: var(--primary-gold); margin-right: 1rem; flex-shrink: 0; }
        .social-icons { display: flex; gap: 1.5rem; margin-top: 1.5rem; }
        .social-icons a { display: inline-block; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--text-muted); display: flex; justify-content: center; align-items: center; transition: all 0.3s ease; }
        .social-icons a:hover { border-color: var(--primary-gold); background-color: var(--primary-gold); }
        .social-icons a:hover svg { fill: #000; }
        .social-icons svg { width: 20px; height: 20px; fill: var(--text-muted); transition: fill 0.3s ease; }
        .footer-bottom { text-align: center; margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #333; font-size: 0.9rem; }
        
        @media (max-width: 768px) {
            /* (മറ്റ് Responsive സ്റ്റൈലുകൾ മാറ്റമില്ല) */
            .main-header { flex-direction: column; padding: 1rem; }
            .logo { margin-bottom: 1rem; }
            .main-nav ul { justify-content: center; flex-wrap: wrap; }
            .main-nav li { margin: 0.25rem 0.75rem; }
            .container { padding: 2rem 1rem; }
            .product-info h1 { font-size: 2rem; }
            .price-retail-large { font-size: 1.8rem; }
            .price-mrp-large, .price-discount-large { font-size: 1rem; }
            .footer-col { text-align: center; }
            .contact-item-footer { justify-content: center; }
            .social-icons { justify-content: center; }
        }
    </style>
</head>

    <!-- **** JavaScript-ൽ മാറ്റം വരുത്തിയിട്ടുണ്ട് **** -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // Firebase കോൺഫിഗറേഷൻ (മാറ്റമില്ല)
        const firebaseConfig = {
            apiKey: "AIzaSyCePcVE_BTiFuYXAApNmbMKHdkhQ9Ay_F4",
            authDomain: "al-ambar-perfume-company.firebaseapp.com",
            projectId: "al-ambar-perfume-company",
            storageBucket: "al-ambar-perfume-company.firebasestorage.app",
            messagingSenderId: "992506041633",
            appId: "1:992506041633:web:f7277461a577248bb8da60",
            measurementId: "G-39XB0WLW6P"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        setLogLevel('Debug');

        // DOM Elements (മാറ്റമില്ല)
        const headerLogo = document.getElementById("header-logo");
        const whatsappFloatBtn = document.getElementById("whatsapp-float-btn");
        const footerPhone = document.getElementById("footer-phone");
        const footerEmail = document.getElementById("footer-email");
        const footerAddress = document.getElementById("footer-address");
        const footerCategoryList = document.getElementById("footer-category-list");
        const productDetailWrapper = document.getElementById("product-detail-wrapper");
        
        let globalSettings = {}; // സെറ്റിംഗ്സ് സേവ് ചെയ്യാൻ

        /**
         * ഉൽപ്പന്നത്തിന്റെ വിവരങ്ങൾ ലോഡ് ചെയ്യുന്നു (*** മാറ്റം വരുത്തി ***)
         */
        async function loadProductDetails() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const productId = urlParams.get('id'); // 'sku' എന്നതിന് പകരം 'id' ഉപയോഗിക്കുന്നു
                
                if (!productId) {
                    productDetailWrapper.innerHTML = '<p class="loading-placeholder">Product ID not found in URL.</p>';
                    return;
                }
                
                const docRef = doc(db, "products", productId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const product = docSnap.data();
                    
                    // *** വിലയും ഡിസ്കൗണ്ടും കണക്കാക്കുന്നു ***
                    let priceHTML = '';
                    const price = product.price || 0;
                    const mrp = product.mrp || 0;

                    if (price > 0) {
                        priceHTML = `<span class="price-retail-large">₹${price}</span>`;
                        
                        if (mrp > price) {
                            const discount = Math.round(((mrp - price) / mrp) * 100);
                            priceHTML += `<del class="price-mrp-large">₹${mrp}</del>`;
                            priceHTML += `<span class="price-discount-large">${discount}% OFF</span>`;
                        }
                    } else {
                        priceHTML = `<span class="price-retail-large">Price on request</span>`;
                    }
                    // *** /വിലയും ഡിസ്കൗണ്ടും ***

                    // ചിത്രങ്ങളുടെ ഗാലറി
                    const images = product.images && product.images.length > 0 ? product.images : ['https://placehold.co/600x600/1e1e1e/D4AF37?text=No+Image'];
                    const firstImage = images[0];
                    let thumbnailsHTML = '';
                    images.forEach((imgUrl, index) => {
                        thumbnailsHTML += `<img src="${imgUrl}" alt="${product.name} thumbnail ${index + 1}" class="gallery-thumb ${index === 0 ? 'active' : ''}" onclick="updateMainImage(this, '${imgUrl}')">`;
                    });

                    // WhatsApp സന്ദേശം തയ്യാറാക്കുന്നു
                    const whatsappMessage = encodeURIComponent(`Hello Al Ambar, I am interested in the product: ${product.name} (Size: ${product.size || 'N/A'})`);
                    const whatsappLink = `https://wa.me/${globalSettings.whatsapp || ''}?text=${whatsappMessage}`;

                    // HTML അപ്ഡേറ്റ് ചെയ്യുന്നു
                    productDetailWrapper.innerHTML = `
                        <div class="product-detail-container">
                            <!-- ഇമേജ് ഗാലറി -->
                            <div class="product-gallery">
                                <img src="${firstImage}" alt="${product.name}" id="main-product-image" class="gallery-main-image">
                                <div class="gallery-thumbnails">
                                    ${thumbnailsHTML}
                                </div>
                            </div>
                            
                            <!-- ഉൽപ്പന്നത്തിന്റെ വിവരങ്ങൾ -->
                            <div class="product-info">
                                <h1>${product.name}</h1>
                                ${product.size ? `<p class="product-size">Size: ${product.size}</p>` : ''}
                                
                                <div class="price-container-large">
                                    ${priceHTML} <!-- അപ്‌ഡേറ്റ് ചെയ്ത വില -->
                                </div>
                                
                                <a href="${whatsappLink}" target="_blank" class="whatsapp-order-btn">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path d="M380.9 97.1C339.4 55.6 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115.4-67.1-157zm-157 341.6c-33.8 0-65-10.1-90.4-27.8l-6.4-3.8-67.1 17.6 17.9-65.5-4.1-6.7c-19.5-31.8-30-67.8-30-104.4 0-100.9 82.1-183 183-183 49.3 0 95.6 19.2 130.4 54.1 34.8 34.8 56.2 81.1 56.1 130.5 0 100.8-82.1 182.9-183 182.9zm101.7-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/></svg>
                                    Order on WhatsApp
                                </a>
                                
                                <div class="product-description">
                                    <h3>Description</h3>
                                    <p>${product.description ? product.description.replace(/\n/g, '<br>') : 'No description available.'}</p>
                                </div>
                            </div>
                        </div>
                    `;

                } else {
                    productDetailWrapper.innerHTML = '<p class="loading-placeholder">Product not found. It may have been removed.</p>';
                }
            } catch (error) {
                console.error("Error loading product details: ", error);
                productDetailWrapper.innerHTML = '<p class="loading-placeholder">Error loading product details. Check console.</p>';
            }
        }

        /**
         * സൈറ്റ് സെറ്റിംഗ്സ് ലോഡ് ചെയ്യുന്നു (മാറ്റമില്ല)
         */
        async function loadSiteSettings() {
            try {
                const catSnapshot = await getDocs(collection(db, "categories"));
                footerCategoryList.innerHTML = '';
                catSnapshot.forEach((doc) => {
                    const category = doc.data();
                    const footerLink = document.createElement('li');
                    footerLink.innerHTML = `<a href="categories.html?filter=${doc.id}">${category.name}</a>`;
                    footerCategoryList.appendChild(footerLink);
                });
                
                const docRef = doc(db, "settings", "global");
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    globalSettings = docSnap.data(); // സെറ്റിംഗ്സ് ഗ്ലോബൽ വേരിയബിളിൽ സേവ് ചെയ്യുന്നു
                    
                    if (globalSettings.logoText) {
                        headerLogo.textContent = globalSettings.logoText;
                    }
                    if (globalSettings.whatsapp) {
                        whatsappFloatBtn.href = `https://wa.me/${globalSettings.whatsapp}?text=Hello%20Al%20Ambar`;
                    }
                    if (globalSettings.phone) {
                        footerPhone.textContent = globalSettings.phone;
                        footerPhone.href = `tel:${globalSettings.phone}`;
                    }
                    if (globalSettings.email) {
                        footerEmail.textContent = globalSettings.email;
                        footerEmail.href = `mailto:${globalSettings.email}`;
                    }
                    if (globalSettings.address) {
                        footerAddress.textContent = globalSettings.address;
                    }
                } else {
                    console.log("No site settings found.");
                }
            } catch (error) {
                console.error("Error loading site settings: ", error);
            }
        }

        // --- പേജ് ലോഡ് ആവുമ്പോൾ ---
        document.addEventListener("DOMContentLoaded", async () => {
            await loadSiteSettings(); // ആദ്യം സെറ്റിംഗ്സ് ലോഡ് ചെയ്യുന്നു (WhatsApp നമ്പറിനായി)
            await loadProductDetails(); // അതിനുശേഷം ഉൽപ്പന്നം ലോഡ് ചെയ്യുന്നു
        });

        // ഗാലറി ചിത്രം മാറ്റാനുള്ള ഫംഗ്ഷൻ
        window.updateMainImage = function(thumbElement, newImageUrl) {
            document.getElementById('main-product-image').src = newImageUrl;
            
            // പഴയ 'active' ക്ലാസ് മാറ്റുന്നു
            document.querySelectorAll('.gallery-thumb').forEach(thumb => thumb.classList.remove('active'));
            
            // പുതിയ തംബിന് 'active' ക്ലാസ് നൽകുന്നു
            thumbElement.classList.add('active');
        }
    </script>
</body>
</html>
