<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot - JR-UD-HUB</title>
    <link rel="stylesheet" href="public.css">
    <link rel="stylesheet" href="explore.css">
</head>
<body>
    <div id="preloader"><div class="loader-logo-container"><img src="" alt="Loading..." id="preloader-logo" style="display: none;"><div class="loader-ring"></div></div></div>
    <header class="main-header" id="main-header"></header>
    <nav class="side-nav" id="side-nav"></nav><div class="nav-overlay" id="nav-overlay"></div>

    <main class="container page-container chatbot-page">
        <section class="chatbot-shell" aria-labelledby="chatbot-title">
            <div class="chatbot-heading">
                <div><p class="chatbot-eyebrow" id="chatbot-brand">JR-UD-HUB</p><h1 id="chatbot-title">Shopping Assistant</h1></div>
                <button id="clear-chat-btn" class="clear-chat-btn" type="button">New chat</button>
            </div>
            <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
            <div class="chat-input-area">
                <form id="chat-form" class="chat-form">
                    <label class="sr-only" for="chat-input">Ask the shopping assistant</label>
                    <textarea id="chat-input" rows="1" maxlength="500" placeholder="Ask about products, protein, diet, ingredients..." required></textarea>
                    <button type="submit" id="chat-send-btn" aria-label="Send message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13"></path><path d="m22 2-7 20-4-9-9-4Z"></path></svg></button>
                </form>
                <p class="chat-disclaimer">AI-generated responses may not always be correct.</p>
            </div>
        </section>
    </main>
    <footer class="main-footer-new" id="main-footer"></footer><div id="floating-action-buttons"></div>
    <script src="public-router.js"></script><script type="module" src="firebase-config.js"></script><script type="module" src="cart.js"></script><script type="module" src="common.js"></script><script type="module" src="explore.js"></script>
</body>
</html>
