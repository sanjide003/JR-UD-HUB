<!-- 
  ഇതാണ് ഷോപ്പിംഗ് കാർട്ട് പേജ്. cart.html
  മാറ്റം: 'My Cart' ഹെഡിംഗ്, സേവിംഗ്സ് ബോക്സ് എന്നിവ ചേർത്തു.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - JR-UD-HUB</title>
    <!-- പൊതുവായ ഡിസൈൻ ഫയൽ -->
    <link rel="stylesheet" href="public.css">
    <link rel="stylesheet" href="cart.css"> 
</head>
<body>

    <!-- 1. ഹെഡർ -->
    <header class="main-header" id="main-header"></header>
    
    <!-- 2. സൈഡ് മെനു -->
    <nav class="side-nav" id="side-nav"></nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <!-- 3. പ്രധാന ഉള്ളടക്കം -->
    <main class="container page-container">
        <div class="page-header-bar center-header">
            <!-- *** മാറ്റം 1: തലക്കെട്ട് മാറ്റി, സെന്റർ ചെയ്തു *** -->
            <h1 class="cart-page-title">My Cart</h1>
            
            <!-- *** മാറ്റം 2: സേവിംഗ്സ് മെസ്സേജ് ബോക്സ് *** -->
            <div id="header-savings-box" class="header-savings-box" style="display: none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05.82 1.87 2.65 1.87 1.96 0 2.4-.98 2.4-1.59 0-.83-.44-1.61-2.67-2.14-2.48-.6-4.18-1.62-4.18-3.67 0-1.72 1.39-2.84 3.11-3.21V4h2.67v1.95c1.86.45 2.79 1.86 2.85 3.39H14.3c-.05-1.11-.64-1.87-2.22-1.87-1.5 0-2.4.68-2.4 1.64 0 .84.65 1.39 2.67 1.91s4.18 1.39 4.18 3.91c-.01 1.83-1.38 2.83-3.12 3.16z"></path></svg>
                <span id="header-savings-text">You'll save ₹0 on this order!</span>
            </div>
        </div>

        <!-- *** കാർട്ട് ലേഔട്ട് *** -->
        <div class="cart-page-layout-new">
            
            <!-- 3.1 ഉൽപ്പന്നങ്ങളുടെ ലിസ്റ്റ് (ഇടതുവശം) -->
            <div class="cart-items-container" id="cart-items-container">
                <!-- 'cart-page.js' വഴി ഉൽപ്പന്ന കാർഡുകൾ വരും -->
            </div>
            
            <!-- 3.2 ആകെ തുകയും ഓർഡർ ബട്ടണും (വലതുവശം) -->
            <div class="cart-summary-container" id="cart-summary-container">
                
                <!-- "Price Details" കാർഡ് -->
                <div class="cart-summary-card">
                    <h2>Price Details</h2>
                    <div class="summary-row">
                        <span id="cart-price-label">Price (0 items)</span>
                        <span id="cart-mrp-total">₹0.00</span>
                    </div>
                    <div class="summary-row discount">
                        <span>Discount</span>
                        <span id="cart-discount">- ₹0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total Amount</span>
                        <span id="cart-total">₹0.00</span>
                    </div>
                    <!-- താഴെയുള്ള പഴയ സേവിംഗ്സ് മെസ്സേജ് ആവശ്യമെങ്കിൽ മറയ്ക്കാം, ഇപ്പോൾ മുകളിൽ കൊടുത്തു -->
                    <div class="summary-savings" id="cart-savings-message" style="display: none;">
                        You'll save ₹0 on this order!
                    </div>
                </div>

                <!-- ബട്ടൺ പ്ലേസ്ഹോൾഡർ -->
                <div id="checkout-button-marker" style="height: 1px; width: 100%; margin-top: 1rem;"></div>

                <!-- "Place All Order" ബട്ടൺ -->
                <button class="btn btn-primary-new btn-checkout-full floating" id="full-checkout-button">
                    <span class="btn-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.61 15.31 3.4 16.78L2.05 22L7.42 20.64C8.83 21.37 10.38 21.82 12.04 21.82C17.5 21.82 21.95 17.37 21.95 11.91C21.95 6.45 17.5 2 12.04 2ZM17.11 15.65C16.82 15.94 15.82 16.46 15.34 16.59C14.86 16.71 14.12 16.78 13.53 16.6C12.94 16.41 11.77 16.03 10.42 14.77C8.85 13.28 7.92 11.47 7.73 11.18C7.54 10.89 7.02 10.15 7.02 9.47C7.02 8.79 7.49 8.35 7.73 8.11C7.97 7.87 8.28 7.81 8.52 7.81C8.76 7.81 8.97 7.81 9.15 7.84C9.33 7.87 9.47 7.9 9.69 8.41C9.91 8.92 10.37 10.13 10.43 10.25C10.49 10.37 10.56 10.56 10.43 10.74C10.31 10.92 10.22 11.02 10.07 11.16C9.92 11.31 9.77 11.41 9.66 11.53C9.54 11.65 9.36 11.83 9.54 12.12C9.72 12.42 10.26 13.23 11.03 13.91C11.97 14.75 12.82 15.02 13.11 15.17C13.4 15.31 13.58 15.28 13.73 15.11C13.87 14.93 14.28 14.43 14.46 14.14C14.65 13.85 14.92 13.79 15.19 13.88C15.46 13.97 16.53 14.52 16.82 14.66C17.11 14.8 17.26 14.89 17.32 15.02C17.38 15.14 17.38 15.36 17.11 15.65Z"></path></svg>
                    </span>
                    <span class="btn-text">Place All Order</span>
                </button>
                
                <div id="cart-error-message" class="cart-error" style="display: none;"></div>
                <div id="checkout-loader" class="loader-small" style="display: none; margin-top: 1rem;"></div>

            </div>
        </div>
    </main>

    <!-- 4. ഫൂട്ടർ -->
    <footer class="main-footer-new" id="main-footer"></footer>

    <!-- JS ഫയലുകൾ -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="common.js"></script>
    <script type="module" src="cart-page.js"></script>
</body>
</html>
