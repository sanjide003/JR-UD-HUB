<!-- 
  ഇതൊരു പുതിയ ഫയലാണ്. ഷോപ്പിംഗ് കാർട്ട് പേജ്.
  'public.css', 'common.js' എന്നിവയോടൊപ്പം 'cart-page.js' എന്ന ഫയലും ഉപയോഗിക്കുന്നു.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale-1.0">
    <title>Shopping Cart - Al Ambar Perfumes</title>
    <!-- പൊതുവായ ഡിസൈൻ ഫയൽ -->
    <link rel="stylesheet" href="public.css">
</head>
<body>

    <!-- 1. പുതിയ ഹെഡർ (common.js വഴി ലോഡ് ആവും) -->
    <header class="main-header" id="main-header"></header>
    
    <!-- 2. വശത്തുള്ള മെനു (common.js വഴി ലോഡ് ആവും) -->
    <nav class="side-nav" id="side-nav"></nav>
    <div class="nav-overlay" id="nav-overlay"></div>

    <!-- 3. പ്രധാന ഉള്ളടക്കം (കാർട്ട്) -->
    <main class="container page-container">
        <div class="page-header-bar">
            <h1>Your Shopping Cart</h1>
        </div>

        <div class="cart-page-layout">
            <!-- കാർട്ടിലെ ഉൽപ്പന്നങ്ങളുടെ ലിസ്റ്റ് -->
            <div class="cart-items-list" id="cart-items-list">
                <!-- 'cart-page.js' ഉപയോഗിച്ച് ഉൽപ്പന്നങ്ങൾ ഇവിടെ വരും -->
            </div>
            
            <!-- കാർട്ടിന്റെ ആകെ തുകയും ചെക്ക്ഔട്ട് ബട്ടണും -->
            <div class="cart-summary" id="cart-summary">
                <h2>Order Summary</h2>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="cart-subtotal">₹0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="cart-total">₹0.00</span>
                </div>
                
                <!-- 
                  പുതിയതായി ചേർത്തത്: alert()-ന് പകരം സന്ദേശം കാണിക്കാനുള്ള സ്ഥലം 
                -->
                <div id="cart-error-message" class="cart-error" style="display: none;"></div>
                
                <button class="btn btn-primary btn-checkout" id="whatsapp-checkout-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 5.6c-.2-1.9-1.7-3.4-3.6-3.6C16.5 1.8 15 2.5 15 2.5s-1.1-.6-3-.6c-1.9 0-3 .6-3 .6s-1.5-.7-2.9-.5C4.2 2.2 2.7 3.7 2.5 5.6c-.2 2.3.8 4.3 2.8 5.6.4.2.8.4 1.2.6.5.2 1 .4 1.5.7.5.3 1 .6 1.5.9.8.5 1.6 1 2.5 1h.1c.9-.1 1.7-.5 2.5-1 .5-.3 1-.6 1.5-.9.5-.3 1-.5 1.5-.7.4-.2.8-.4 1.2-.6 2-1.3 3-3.4 2.8-5.6zM12 18.1s-1.6-1.5-4.4-3.2c-.4-.3-.8-.6-1.1-.9-.3-.3-.6-.6-.8-1-.2-.4-.3-.8-.3-1.3 0-1.3.8-2.5 2-3 1.1-.5 2.4-.3 3.5.6.4.3.7.7 1 1.1.3-.4.6-.8 1-1.1 1.1-.9 2.4-1.1 3.5-.6 1.2.5 2 1.7 2 3 0 .5-.1.9-.3 1.3-.2.4-.5.7-.8 1-.3.3-.7.6-1.1.9-2.8 1.7-4.4 3.2-4.4 3.2z"></path></svg>
                    Order on WhatsApp
                </button>
                <div id="checkout-loader" class="loader-small" style="display: none;"></div>
            </div>
        </div>
    </main>

    <!-- 4. പുതിയ ഫൂട്ടർ (common.js വഴി ലോഡ് ആവും) -->
    <footer class="main-footer" id="main-footer"></footer>

    <!-- JS ഫയലുകൾ -->
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="cart.js"></script>
    <script type="module" src="common.js"></script>
    <script type="module" src="cart-page.js"></script>
</body>
</html>
